#modal.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
/* full-size variant — photo view fills the page with ~50px margin all around */
#modal.modal-full{width:calc(100vw - 100px);max-width:calc(100vw - 100px);height:calc(100vh - 100px);display:flex;flex-direction:column}
#modal.modal-full .md-body{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;overflow:hidden}
#modal.modal-full .mdphoto{flex:1;min-height:0;width:100%;aspect-ratio:auto}

.md-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--stroke)}
.md-title{font-family:var(--display);font-size:16px;font-weight:700;color:var(--ink)}
.md-x{width:28px;height:28px;border:1px solid var(--stroke);background:var(--white);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--t2)}

/* ── UPLOAD (Add photos) modal ── */
.up-dest{font-size:12.5px;color:var(--t2);margin-bottom:14px}
.up-dest b{color:var(--ink);font-weight:600}
.up-zone{border:1.5px dashed var(--midtone);background:var(--sunken);padding:30px 20px;text-align:center;cursor:pointer;transition:all .14s}
.up-zone:hover{border-color:var(--ink);background:var(--wash)}
.up-zone.drag{border-color:var(--ink);background:var(--wash);border-style:solid}
.up-zone-ico{width:34px;height:34px;margin:0 auto 12px;border:1.5px solid var(--midtone);display:flex;align-items:center;justify-content:center;color:var(--midtone)}
.up-zone-ico svg{width:16px;height:16px}
.up-zone:hover .up-zone-ico{border-color:var(--ink);color:var(--ink)}
.up-zone-main{font-family:var(--body);font-size:13.5px;font-weight:600;color:var(--ink);margin-bottom:4px}
.up-zone-sub{font-family:var(--mono);font-size:10px;letter-spacing:.02em;color:var(--t3)}
.up-staged{margin-top:16px}
.up-staged-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.up-staged-hd span{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.up-clear{font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--t2);background:none;border:none;cursor:pointer}
.up-clear:hover{color:var(--error)}
.up-thumbs{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.up-thumb{aspect-ratio:1;background:var(--stroke)}
.up-thumb.up-more{display:flex;align-items:center;justify-content:center;background:var(--midtone);color:#fff;font-family:var(--mono);font-size:11px;font-weight:700}
.up-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.up-cancel,.up-confirm{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:11px 18px;cursor:pointer;transition:all .12s;border:1px solid var(--stroke)}
.up-cancel{background:var(--white);color:var(--ink)}
.up-cancel:hover{border-color:var(--ink)}
.up-confirm{background:var(--ink);color:var(--white);border-color:var(--ink)}
.up-confirm:hover{opacity:.9}
.up-confirm:disabled{background:var(--sunken);color:var(--t3);border-color:var(--stroke);cursor:default;opacity:1}
.del-msg{font-size:13px;line-height:1.55;color:var(--t2)}
.del-confirm{background:var(--error);border-color:var(--error)}
.del-confirm:hover{opacity:.9}
.md-context{font-size:12.5px;color:var(--t2);margin-bottom:14px;line-height:1.5}
.md-context b{color:var(--ink);font-weight:600}
.md-label{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);display:block;margin-bottom:6px}
.md-textarea{width:100%;min-height:96px;resize:vertical;font-family:var(--body);font-size:13px;color:var(--ink);background:var(--white);border:1px solid var(--midtone);padding:10px;outline:none;line-height:1.5}
.md-textarea:focus{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.md-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.md-btn{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:10px 16px;border:1px solid var(--stroke);background:var(--white);color:var(--ink);cursor:pointer;transition:all .12s}
.md-btn:hover{border-color:var(--ink)}
.md-btn.primary{background:var(--ink);color:var(--white);border-color:var(--ink)}
.md-btn.danger{background:var(--error);color:var(--white);border-color:var(--error)}
.md-btn.danger:hover{background:#A6362D}
.md-warn{font-size:12.5px;color:var(--t2);line-height:1.55}

/* ── toast ── */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--white);font-size:12.5px;padding:11px 18px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:400;font-weight:500;display:flex;align-items:center}
#toast.show{pointer-events:auto}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

<div id="app">

  <!-- VARIANTS bar — above the chrome, for comparing layouts (phase-specific) -->

</div>

    <button class="md-x" onclick="closeModal()"><svg viewBox="0 0 14 14" fill="none"><path d="M3 3l8 8M11 3l-8 8" stroke="currentColor" stroke-linecap="round"/></svg></button></div>
  <div class="md-body" id="mdBody"></div>

<div id="toast"></div>

<script>
/* ════════════ DATA ════════════ */
const ATT = {
  unassigned:{label:'Unassigned contractor', cls:'c-unassigned'},
  missing:   {label:'Missing product',        cls:'c-missing'},
  oos:       {label:'Out of stock',           cls:'c-oos'},
  deferred:  {label:'Deferred',               cls:'c-deferred'},
  tenant:    {label:'Tenant responsible',     cls:'c-tenant'},
  fin:       {label:'Financial modifier',     cls:'c-fin'},
};
/* resolvable system-detected problems */
const FLAGS = {
  unassigned:{label:'Unassigned contractor', cls:'c-unassigned'},
  missing:   {label:'Missing product',       cls:'c-missing'},
  oos:       {label:'Out of stock',          cls:'c-oos'},
  editreq:   {label:'Edit requested',        cls:'c-editreq'},
};
/* user-created modifier tags (up to 5 per project). kind: financial | display */
let PROJECT_MODS = [
  {id:'tenant',   label:'Tenant responsible', kind:'financial'},
  {id:'deferred', label:'Deferred',           kind:'financial'},
  {id:'required', label:'Required',           kind:'display'},
];
const STATUS = {
  not_started: {label:'Not started',    cls:'s-notstarted'},
  in_progress: {label:'In progress',    cls:'s-inprogress'},
  pending:     {label:'Pending review', cls:'s-pending'},
  in_review:   {label:'In review',      cls:'s-inreview'},
  complete:    {label:'Complete',       cls:'s-complete'},
};
const ROOMS = ['Kitchen','Living Room','Master Bath','Bathroom','Master Bed','Bedroom 2','Garage'];
/* room-level context used by the Details tab */
const ROOM_META = {
  'Kitchen':     {dims:"14' × 16' · 224 SF · 9' ceiling", light:'East-facing windows, bright AM'},
  'Living Room': {dims:"18' × 20' · 360 SF · 9' ceiling", light:'South-facing, bright all day'},
  'Master Bath': {dims:"10' × 12' · 120 SF · 8' ceiling", light:'One north window, dim'},
  'Bathroom':    {dims:"6' × 8' · 48 SF · 8' ceiling",    light:'No windows, fixture only'},
  'Master Bed':  {dims:"14' × 15' · 210 SF · 9' ceiling", light:'West-facing, bright PM'},
  'Bedroom 2':   {dims:"11' × 12' · 132 SF · 8' ceiling", light:'North-facing, even'},
  'Garage':      {dims:"20' × 20' · 400 SF · 10' ceiling",light:'No windows, overhead only'},
};
const TRADE_BY_GC = {
  'Apex Carpentry':'Carpentry','Stone Bros':'Stone & tile','FloorWorks':'Flooring',
  'BrightElectric':'Electrical','ProPlumb':'Plumbing',
};
/* room accent dots (bright palette) */
const ROOM_COLOR = {
  'Kitchen':'#E8702A','Living Room':'#3B8FD4','Master Bath':'#8B5DD4','Bathroom':'#3DA86A',
  'Master Bed':'#E03E3E','Bedroom 2':'#F0D040','Garage':'#7D7469'
};
/* deterministic swatch tone for a photo box, tinted toward the room color */
function photoTone(room,i){
  const base=ROOM_COLOR[room]||'#7D7469';
  // mix room color with a warm neutral, varied per index, kept muted
  const n=(i*37)%5; const lum=[.42,.52,.6,.48,.56][n];
  return mixHex(base,'#B8AE9E',lum);
}
function mixHex(a,b,t){
  const pa=[1,3,5].map(k=>parseInt(a.substr(k,2),16));
  const pb=[1,3,5].map(k=>parseInt(b.substr(k,2),16));
  const r=pa.map((v,k)=>Math.round(v*(1-t)+pb[k]*t));
  return '#'+r.map(v=>v.toString(16).padStart(2,'0')).join('');
}
/* mock people + date pool for annotations */
const PHOTO_PEOPLE = [
  {who:'J. Chen',    role:'Field Agent'},
  {who:'M. Alvarez', role:'Field Agent'},
  {who:'T. Okafor',  role:'Manager'},
  {who:'S. Patel',   role:'Ops'},
  {who:'R. Brooks',  role:'Field Agent'},
];
function photoMeta(seed){
  const per=PHOTO_PEOPLE[seed%PHOTO_PEOPLE.length];
  const source=(seed%3===0)?'Uploaded':'Captured';
  // date MM/DD/YY, spread across a couple months
  const d=new Date(2026,4,1); d.setDate(d.getDate()+((seed*7)%54));
  const mm=String(d.getMonth()+1).padStart(2,'0');
  const dd=String(d.getDate()).padStart(2,'0');
  const yy=String(d.getFullYear()).slice(2);
  return {who:per.who, role:per.role, source, date:`${mm}/${dd}/${yy}`};
}
/* ══ MUTABLE PHOTO STORE ══
   Every photo is a record with a stable id + assignment. Move/Delete/Add mutate
   this array; all gallery views read filtered slices of it, so counts stay live.
   Seeded once from the original mock generators so the initial view is unchanged. */
let PHOTOS = [];
let _pid = 1;
function seedPhotos(){
  PHOTOS = []; _pid = 1;
  ROOMS.forEach(room=>{
    // group-level photos
    const base=ROOMS.indexOf(room)*13; const gn=[6,3,4,2,3,2,2][ROOMS.indexOf(room)]||2;
    for(let i=0;i<gn;i++) PHOTOS.push({id:_pid++, seed:base+i, room, kind:'group', task:null});
    // task photos
    let s=ROOMS.indexOf(room)*13+50;
    TASKS.filter(t=>t.room===room).forEach(t=>{
      for(let k=0;k<(t.photos||0);k++) PHOTOS.push({id:_pid++, seed:s++, room, kind:'task', task:t.code});
    });
  });
  // unsorted
  for(let i=0;i<9;i++) PHOTOS.push({id:_pid++, seed:900+i, room:'Project', kind:'unsorted', task:null});
}
/* filtered views (return the live records, not copies) */
function groupPhotos(room){ return PHOTOS.filter(p=>p.room===room && p.kind==='group'); }
function photosForTask(t){ return PHOTOS.filter(p=>p.kind==='task' && p.task===t.code); }
function taskPhotosFor(room,tasks){ const codes=new Set(tasks.map(t=>t.code)); return PHOTOS.filter(p=>p.kind==='task' && p.room===room && codes.has(p.task)); }
function unsortedPhotos(){ return PHOTOS.filter(p=>p.kind==='unsorted'); }
const UNSORTED_COUNT = 9;

/* ══ SELECTION + PHOTO OPERATIONS (Create-phase management) ══ */
let photoSel = new Set();   // selected photo ids
let lastDeleted = null;     // for undo: {photos:[...records], at:timestamp}

function togglePhotoSel(id){
  photoSel.has(id) ? photoSel.delete(id) : photoSel.add(id);
  renderWork(); renderSelBar();
}
function clearPhotoSel(){ photoSel.clear(); renderWork(); renderSelBar(); }

function deleteSelected(){
  if(!photoSel.size) return;
  openDeleteModal();
}
/* confirmation modal before removing */
function openDeleteModal(){
  const n=photoSel.size;
  document.getElementById('mdTitle').textContent=`Delete ${n} ${n===1?'photo':'photos'}?`;
  document.getElementById('mdBody').innerHTML=`
    <div class="del-msg">This removes ${n===1?'this photo':`these ${n} photos`} from the project. You can undo right after, but the action can’t be recovered once you move on.</div>
    <div class="up-foot">
      <button class="up-cancel" onclick="closeModal()">Cancel</button>
      <button class="up-confirm del-confirm" onclick="performDelete()">Delete ${n} ${n===1?'photo':'photos'}</button>
    </div>`;
  document.getElementById('modal').classList.add('open');
  document.getElementById('modal-scrim').classList.add('open');
}
function performDelete(){
  if(!photoSel.size){ closeModal(); return; }
  const removed = PHOTOS.filter(p=>photoSel.has(p.id));
  PHOTOS = PHOTOS.filter(p=>!photoSel.has(p.id));
  lastDeleted = {photos:removed};
  photoSel.clear();
  syncTaskCounts();
  closeModal();
  renderWork(); renderSelBar();
  toast(`${removed.length} ${removed.length===1?'photo':'photos'} deleted`, {label:'Undo', fn:undoDelete});
}
function undoDelete(){
  if(!lastDeleted) return;
  PHOTOS = PHOTOS.concat(lastDeleted.photos);
  lastDeleted = null;
  syncTaskCounts();
  renderWork();
}
/* move selection to a target: {kind:'unsorted'} | {kind:'group',room} | {kind:'task',room,task} */
function moveSelectedTo(target){
  if(!photoSel.size) return;
  const n = photoSel.size;
  PHOTOS.forEach(p=>{
    if(!photoSel.has(p.id)) return;
    if(target.kind==='unsorted'){ p.kind='unsorted'; p.room='Project'; p.task=null; }
    else if(target.kind==='group'){ p.kind='group'; p.room=target.room; p.task=null; }
    else if(target.kind==='task'){ p.kind='task'; p.room=target.room; p.task=target.task; }
  });
  photoSel.clear();
  syncTaskCounts();
  closeMoveMenu();
  renderWork(); renderSelBar();
  toast(`${n} ${n===1?'photo':'photos'} moved`);
}
/* keep TASKS[].photos in sync with the store so left panel + headers match */
function syncTaskCounts(){
  TASKS.forEach(t=>{ t.photos = PHOTOS.filter(p=>p.kind==='task' && p.task===t.code).length; });
}

/* the bottom selection bar — appears when 1+ photos are selected */
function renderSelBar(){
  const bar=document.getElementById('selBar');
  if(!bar) return;
  const n=photoSel.size;
  if(!n){ bar.classList.remove('show'); bar.setAttribute('aria-hidden','true'); closeMoveMenu(); return; }
  bar.setAttribute('aria-hidden','false');
  bar.innerHTML=`
    <span class="sel-count">${n} selected</span>
    <div class="sel-actions">
      <button class="sel-btn sel-del" onclick="deleteSelected()">Delete</button>
      <button class="sel-btn sel-primary" onclick="openMoveMenu()">Move to…</button>
      <span class="sel-divider"></span>
      <button class="sel-btn sel-ghost" onclick="clearPhotoSel()">Deselect</button>
    </div>`;
  bar.classList.add('show');
}
/* MOVE MENU — target picker: Unsorted, or any group / task */
function openMoveMenu(){
  const menu=document.getElementById('moveMenu');
  if(!menu) return;
  let rows=`<button class="mv-row mv-unsorted" onclick="moveSelectedTo({kind:'unsorted'})">Unsorted <span class="mv-sub">remove from task</span></button>`;
  ROOMS.filter(r=>TASKS.some(t=>t.room===r)).forEach(room=>{
    rows+=`<button class="mv-row mv-group" onclick="moveSelectedTo({kind:'group',room:'${room}'})">${room} <span class="mv-sub">group photos</span></button>`;
    TASKS.filter(t=>t.room===room).forEach(t=>{
      rows+=`<button class="mv-row mv-task" onclick="moveSelectedTo({kind:'task',room:'${room}',task:'${t.code}'})"><span class="mv-taskname">${t.name}</span></button>`;
    });
  });
  menu.innerHTML=`<div class="mv-hd">Move ${photoSel.size} ${photoSel.size===1?'photo':'photos'} to</div><div class="mv-list">${rows}</div>`;
  menu.classList.add('show');
  menu.setAttribute('aria-hidden','false');
}
function closeMoveMenu(){
  const menu=document.getElementById('moveMenu');
  if(menu){ menu.classList.remove('show'); menu.setAttribute('aria-hidden','true'); }
}
/* ADD (simulated): append placeholder photos into a target, no real upload */
function addPhotosTo(target, count){
  count = count || (3 + Math.floor(Math.random()*4)); // 3–6 placeholders
  for(let i=0;i<count;i++){
    const rec = {id:_pid++, seed:1000+_pid, room:'Project', kind:'unsorted', task:null};
    if(target.kind==='group'){ rec.kind='group'; rec.room=target.room; }
    else if(target.kind==='task'){ rec.kind='task'; rec.room=target.room; rec.task=target.task; }
    PHOTOS.push(rec);
  }
  syncTaskCounts();
  renderWork();
  toast(`${count} ${count===1?'photo':'photos'} added${target.kind==='unsorted'?' to Unsorted':''}`);
}
const CONTRACTORS = ['Apex Carpentry','Stone Bros','FloorWorks','BrightElectric','ProPlumb'];
const OPTIONS = ['Replace','Install','Reface','Repair','Remove','Full repaint','Tenant install'];

const TASKS = [
  {id:1, code:'KIT-79B1', room:'Kitchen', name:'Cabinets', opt:'Replace — shaker, white', gc:'Apex Carpentry', product:'', qty:'14 LF', rate:'$680', cost:'$5,020', photos:12, flags:['missing'], mods:['tenant'], status:'not_started', desc:'Demo existing uppers and base cabinets. Install new shaker fronts, soft-close hardware, and toe-kick. Verify wall is plumb before hanging.', pcost:'$310', notes:2, sku:'DN-ARC-WHT-14'},

function dollars(c){ return parseFloat(String(c).replace(/[$,]/g,''))||0; }
function money(n){ return '$'+n.toLocaleString(); }
/* parse leading number from a qty string like "14 LF", "1 suite" */
function qtyNum(q){ const m=String(q==null?'':q).match(/[\d,.]+/); return m?parseFloat(m[0].replace(/,/g,'')):NaN; }
/* (product unit cost x quantity) + labor rate */
function calcSubtotal(pcost,qty,rate){
  const pc=dollars(pcost), q=qtyNum(qty), lr=dollars(rate);
  if(isNaN(q) || (!pcost && !rate)) return '';
  const total=pc*q+lr;
  return money(Math.round(total));
}

/* unified lookup: a key may be a flag or a project modifier */
function tagInfo(k){
  if(FLAGS[k]) return {label:FLAGS[k].label, cls:FLAGS[k].cls, kind:'flag'};
  const m=PROJECT_MODS.find(x=>x.id===k);
  if(m) return {label:m.label, cls:'c-'+m.id, kind:'mod', modKind:m.kind};
  return {label:k, cls:'c-fin', kind:'mod'};
}
function taskKeys(t){ return [...(t.flags||[]), ...(t.mods||[])]; }
function hasAttention(t){ return taskKeys(t).length>0; }

function visibleTasks(){
  if(activeFilters.size===0) return TASKS.slice();
  return TASKS.filter(t => taskKeys(t).some(a => activeFilters.has(a)));
}
function attCounts(){
  const c={};
  TASKS.forEach(t=>taskKeys(t).forEach(a=>{c[a]=(c[a]||0)+1;}));
  return c;
}
function groupTasks(tasks){
  if(groupBy==='room'){
    return ROOMS.map(r=>({key:r,name:r,pinned:false,items:tasks.filter(t=>t.room===r)})).filter(g=>g.items.length);
  }
  const un=tasks.filter(t=>!t.gc);
  const gcs=[...new Set(tasks.filter(t=>t.gc).map(t=>t.gc))].sort();
  const groups=[];
  if(un.length) groups.push({key:'__un',name:'Unassigned',pinned:true,items:un});
  gcs.forEach(g=>groups.push({key:g,name:g,pinned:false,items:tasks.filter(t=>t.gc===g)}));
  return groups;
}

/* ════════════ ATTENTION FILTER ════════════ */
function renderFilter(){
  const menu=document.getElementById('afMenu');
  const counts=attCounts();
  const flagOrder=['unassigned','missing','oos','editreq'];
  const modOrder=PROJECT_MODS.map(m=>m.id);
  function optHTML(k){
    const on=activeFilters.has(k); const info=tagInfo(k);
    return `<button class="af-opt${on?' on':''}" onclick="toggleFilter('${k}')">
      <span class="dot ${info.cls}"></span><span class="lbl">${info.label}</span>
      <span class="n">${counts[k]}</span>
      <svg class="ck" viewBox="0 0 14 14" fill="none"><path d="M2.5 7.5l3 3 6-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>`;
  }
  const flagOpts=flagOrder.filter(k=>counts[k]>0).map(optHTML).join('');
  const modOpts=modOrder.filter(k=>counts[k]>0).map(optHTML).join('');
  let body='';
  if(flagOpts) body+=`<div class="af-grouplabel">Flags</div>`+flagOpts;
  if(modOpts) body+=`<div class="af-grouplabel">Modifiers</div>`+modOpts;
  if(!body) body=`<div class="af-grouplabel" style="padding:10px">No attention items in scope</div>`;
  const vis=visibleTasks().length;
  const showing=activeFilters.size?`Showing ${vis} of ${TASKS.length}`:`${TASKS.length} tasks`;
  menu.innerHTML=body+`<div class="af-foot"><span class="af-showing">${showing}</span>
    <button class="af-clear" onclick="clearFilter()" ${activeFilters.size?'':'disabled'}>Clear all</button></div>`;
  const af=document.getElementById('af');
  const total=[...activeFilters].reduce((s,k)=>s+(counts[k]||0),0);
  af.classList.toggle('active',activeFilters.size>0);
  document.getElementById('afLabel').textContent=
    activeFilters.size?(activeFilters.size===1?tagInfo([...activeFilters][0]).label:`${activeFilters.size} filters`):'Attention';
  document.getElementById('afCount').textContent=activeFilters.size?total:'';
}
function toggleFilter(k){ activeFilters.has(k)?activeFilters.delete(k):activeFilters.add(k); renderAll(); }
function clearFilter(){ activeFilters.clear(); renderAll(); }
function toggleAf(e){ e.stopPropagation(); document.getElementById('af').classList.toggle('open'); }
document.addEventListener('click',e=>{ const af=document.getElementById('af'); if(af&&!af.contains(e.target)) af.classList.remove('open'); });

function attDots(t){
  const keys=taskKeys(t);
  if(!keys.length) return '';
  return `<div class="task-att">`+keys.map(a=>{const i=tagInfo(a);return `<span class="att-dot ${i.cls}" title="${i.label}"></span>`;}).join('')+`</div>`;
}
function taskStatus(t){
  const s=STATUS[t.status]||STATUS.not_started;
  return `<span class="task-status ${s.cls}">${s.label}</span>`;
}
function esc(s){ return String(s==null?'':s).replace(/"/g,'&quot;'); }

        </div>
      </div>`).join('');
    return;
  }
  const tasks=visibleTasks();
  const groups=groupTasks(tasks);
  const ruCount=tasks.length;
  const ruCost=tasks.reduce((s,t)=>s+dollars(t.cost),0);
  document.getElementById('sbRollup').innerHTML=
    `<span class="n">${ruCount}</span> ${ruCount===1?'task':'tasks'}<span class="sep">·</span><span class="n">${money(ruCost)}</span>`;

  if(collapsedGrps===null) collapsedGrps=new Set(groups.slice(1).map(g=>g.key));
  scroll.innerHTML=groups.map(g=>{
    const cost=g.items.reduce((s,t)=>s+dollars(t.cost),0);
    const isCollapsed=collapsedGrps.has(g.key);
    const allApproved=g.items.every(t=>approved.has(t.id));
    return `<div class="grp${g.pinned?' pinned':''}${isCollapsed?' collapsed':''}${allApproved?' allapproved':''}${mediaScope===g.key?' media-sel':''}" data-grp="${g.key}">
      <div class="grp-hdr" onclick="setMediaScope('${g.key}')">
        <svg class="grp-caret" viewBox="0 0 12 12" fill="none" onclick="event.stopPropagation();toggleGrp(this)"><path d="M3 4.5L6 7.5l3-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="grp-name">${g.name}</span>
        <span class="grp-meta">${g.items.length} ${g.items.length===1?'task':'tasks'} · ${money(cost)}</span>
        ${groupBy==='room'?`<button class="grp-media" onclick="event.stopPropagation();openGroupDrawer('${g.key}')" title="Room activity — notes & history">
          <svg viewBox="0 0 24 24"><path d="M4 12h4l2-6 4 12 2-6h4"/></svg></button>`:''}
      </div>
      <div class="grp-body">${g.items.map(taskRow).join('')}
        <div class="grp-footer">
          <span class="gf-name">${g.name} Group</span>
          <button class="gf-btn approve${allApproved?' on':''}" onclick="event.stopPropagation();approveGroup('${g.key}')">${allApproved?'Approved':'Approve All'}</button>
          <button class="gf-btn danger" onclick="event.stopPropagation();confirmDelete('group','${g.key}')">Reject All</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function openEditReq(scope,key){
  const title=document.getElementById('mdTitle');
  const body=document.getElementById('mdBody');
  let ctx;
  if(scope==='task'){ const t=TASKS.find(x=>x.id===key); ctx=`<b>${t.name}</b> · ${t.code}`; }
  else { const items=TASKS.filter(t=>t.room===key); ctx=`<b>${key}</b> · ${items.length} ${items.length===1?'task':'tasks'}`; }
  title.textContent='Request edit';
  body.innerHTML=`
    <div class="md-context">Requesting an edit on ${ctx}. This flags the ${scope==='task'?'task':'group'} for the scope builder and appears as an Edit requested flag.</div>

    <textarea class="md-textarea" id="mdNote" placeholder="Describe the change you're requesting..."></textarea>

    </div>`;
  openModal();

let editReqNotes={}; // taskId -> note
function submitEditReq(scope,key){
  const note=(document.getElementById('mdNote').value||'').trim();
  if(!note){ document.getElementById('mdNote').focus(); return; }
  const apply=t=>{
    t.flags=t.flags||[]; if(!t.flags.includes('editreq')) t.flags.push('editreq');
    editReqNotes[t.id]=note; t.notes=(t.notes||0)+1;
    const now=new Date();
    noteLog[t.id]=noteLog[t.id]||[];
    noteLog[t.id].push({type:'editreq', who:'You', when:'Today · '+now.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}), ts:now.toISOString(), body:note});
  };
  if(scope==='task'){ const t=TASKS.find(x=>x.id==key); if(t) apply(t); toast('Edit requested'); }
  else { TASKS.filter(t=>t.room===key).forEach(apply); toast(`Edit requested for ${key}`); }

/* ════════════ DELETE (with confirm) ════════════ */
function confirmDelete(scope,key){
  const title=document.getElementById('mdTitle');
  const body=document.getElementById('mdBody');
  let ctx,warn;
  if(scope==='task'){ const t=TASKS.find(x=>x.id==key); ctx=`<b>${t.name}</b> (${t.code})`; warn=`Delete this task from the scope?`; }
  else { const items=TASKS.filter(t=>t.room===key); ctx=`<b>${key}</b> and its ${items.length} ${items.length===1?'task':'tasks'}`; warn=`Delete this entire group?`; }
  title.textContent='Delete';
  body.innerHTML=`
    <p class="md-warn">${warn}<br><br>This removes ${ctx} from the scope. This can't be undone.</p>
    <div class="md-actions">
      <button class="md-btn" onclick="closeModal()">Cancel</button>
      <button class="md-btn danger" onclick="doDelete('${scope}','${String(key).replace(/'/g,"\\'")}')">Delete</button>
    </div>`;
  openModal();
}
function doDelete(scope,key){
  if(scope==='task'){
    const i=TASKS.findIndex(t=>t.id==key);
    if(i>=0){ const nm=TASKS[i].name; openIds.delete(TASKS[i].id); approved.delete(TASKS[i].id); TASKS.splice(i,1); toast(`${nm} deleted`); }
  } else {
    const removed=TASKS.filter(t=>t.room===key);
    removed.forEach(t=>{openIds.delete(t.id);approved.delete(t.id);});
    for(let i=TASKS.length-1;i>=0;i--) if(TASKS[i].room===key) TASKS.splice(i,1);
    toast(`${key} deleted`);
  }
  closeModal();
  collapsedGrps=null;
  renderAll();
}

let dwCtx=null; // {type:'task', id} | {type:'room', room}

/* note store — keyed by task id; each note has type: editreq | public | internal */
const NOTE_TYPES={
  editreq: {label:'Edit request', cls:'nt-editreq'},
  public:  {label:'Public',       cls:'nt-public'},
  internal:{label:'Internal',     cls:'nt-internal'},
};
let noteLog={
  1:[{type:'public', who:'Field Agent', when:'Apr 18 · 9:42a', ts:'2026-04-18T09:42', body:'Existing condition worse than listing photos suggested.'},
     {type:'internal', who:'Ada (Reviewer)', when:'Apr 21 · 2:15p', ts:'2026-04-21T14:15', body:'Double-check finish against approved sample before sign-off.'}],
  3:[{type:'public', who:'Field Agent', when:'Apr 18 · 10:10a', ts:'2026-04-18T10:10', body:'Wall not plumb on the north run — flag for contractor.'}],
  8:[{type:'internal', who:'Or (PM)', when:'Apr 22 · 8:30a', ts:'2026-04-22T08:30', body:'Allowance only. True up once homeowner selects.'},
     {type:'public', who:'Stone Bros', when:'Apr 24 · 1:12p', ts:'2026-04-24T13:12', body:'Measured on site. Need an extra day for the return panel.'}],
  9:[{type:'public', who:'Field Agent', when:'Apr 18 · 9:50a', ts:'2026-04-18T09:50', body:'Waterproofing inspection must be scheduled before tile.'}],
};
function statusEvents(t){
  // synthesized status timeline up to the task's current status
  const order=['not_started','in_progress','pending','in_review','complete'];
  const times={not_started:'Apr 19 · 11:03a',in_progress:'Apr 23 · 7:40a',pending:'Apr 21 · 2:15p',in_review:'Apr 25 · 10:00a',complete:'Apr 28 · 4:30p'};
  const tss={not_started:'2026-04-19T11:03',in_progress:'2026-04-23T07:40',pending:'2026-04-21T14:15',in_review:'2026-04-25T10:00',complete:'2026-04-28T16:30'};
  const evt=[{kind:'status', label:'Added to scope', when:'Apr 19 · 11:00a', ts:'2026-04-19T11:00'}];
  const idx=order.indexOf(t.status);
  for(let i=0;i<=idx;i++){ const s=order[i]; evt.push({kind:'status', label:(STATUS[s]||{}).label||s, when:times[s], ts:tss[s]}); }
  return evt;
}
function taskActivity(t){
  const notes=(noteLog[t.id]||[]).map(n=>({kind:'note', ...n}));
  const evts=statusEvents(t);
  return [...evts, ...notes].sort((a,b)=> (a.ts<b.ts?-1:a.ts>b.ts?1:0));
}
function roomActivity(room){
  const items=TASKS.filter(t=>t.room===room);
  let all=[];
  items.forEach(t=>{
    statusEvents(t).forEach(e=>all.push({...e, src:`${t.name}`}));
    (noteLog[t.id]||[]).forEach(n=>all.push({kind:'note', ...n, src:`${t.name}`}));
  });
  (noteLog['room:'+room]||[]).forEach(n=>all.push({kind:'note', ...n, src:'Room'}));
  return all.sort((a,b)=> (a.ts<b.ts?-1:a.ts>b.ts?1:0));
}

/* notes only (chronological), and status events only */
function taskNotesList(t){ return (noteLog[t.id]||[]).map(n=>({...n})).sort((a,b)=>a.ts<b.ts?-1:a.ts>b.ts?1:0); }
function roomNotesList(room){
  let all=[];
  TASKS.filter(t=>t.room===room).forEach(t=>(noteLog[t.id]||[]).forEach(n=>all.push({...n, src:t.name})));
  (noteLog['room:'+room]||[]).forEach(n=>all.push({...n, src:'Room'}));
  return all.sort((a,b)=>a.ts<b.ts?-1:a.ts>b.ts?1:0);

function taskStatusList(t){ return statusEvents(t).sort((a,b)=>a.ts<b.ts?-1:a.ts>b.ts?1:0); }
function roomStatusList(room){
  let all=[];
  TASKS.filter(t=>t.room===room).forEach(t=>statusEvents(t).forEach(e=>all.push({...e, src:t.name})));
  return all.sort((a,b)=>a.ts<b.ts?-1:a.ts>b.ts?1:0);
}

const VARIANT_INFO = {
  gallery:  {modes:['Gallery'], tag:'Variant · Gallery', title:'Photos & video', desc:'Review the scope through captured evidence — photos and walkthrough video per task, browsable by room or contractor.'},
  blueprint:{modes:['Blueprint','Gallery','Shop'], tag:'Variant · Blueprint', title:'Floor plan & coverage', desc:'Review by location. Tasks pinned to where they happen, with rooms shaded by whether they carry scope — so gaps surface ("this room has nothing — did we miss it?").'},
  cost:     {modes:['Cost','Gallery','Shop'], tag:'Variant · Cost', title:'Financial shape', desc:'Review the money. Subtotals by room, contractor, and trade against the project total — to judge whether the scope is proportioned and free of surprises.'},
};
function renderWorkHdr(){
  const info=VARIANT_INFO[variant];
  // Drawing Set: outer top bar (Overview for now) sits above the pinned card + inner tabs
  if(galleryLayout==='drawing'){
    document.getElementById('workHdr').style.display='';
    document.getElementById('workHdr').innerHTML=
      DS_TABS.map(([k,label])=>
        `<button class="wmode${dsTab===k?' active':''}" onclick="setDsTab('${k}')">${label}</button>`
      ).join('');
    return;
  }
  document.getElementById('workHdr').style.display='';
  document.getElementById('workHdr').innerHTML=
    info.modes.map((m,i)=>`<button class="wmode${i===0?' active':''}">${m}</button>`).join('');
}
function setDsTab(k){ dsTab=k; renderWorkHdr(); renderWork(); }
const DS_TABS=[['snapshot','Snapshot'],['photos','Gallery'],['pano','Pano'],['floorplan','Floor Plan'],['products','Products'],['activitynotes','Activity & Notes']];
function dsTabBar(){
  return `<div class="ds-tabbar">${DS_TABS.map(([k,label])=>
    `<button class="ds-tab${dsTab===k?' active':''}" onclick="setDsTab('${k}')">${label}</button>`).join('')}</div>`;
}
function renderWork(){
  const info=VARIANT_INFO[variant];
  if(emptyState){
    document.getElementById('workBody').innerHTML=`
      <div class="ph" style="height:100%;justify-content:center">
        <span class="ph-title">Media</span>
        <span class="ph-desc">Upload project photos. Once uploaded you can assign them to groups and tasks.</span>
        <button onclick="addMediaTo('Scope')" style="margin-top:20px;height:38px;padding:0 22px;background:var(--ink);border:none;color:var(--white);font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;cursor:pointer">Upload Photos</button>
      </div>`;
    return;
  }
  if(galleryLayout==='drawing'){
    const ctx=currentDetailLevel();
    // PHOTOS tab → the full gallery, unchanged (all management tools)
    if(dsTab==='photos'){
      let html=`<div class="ds-galwrap">${renderGallery()}</div>`;
      document.getElementById('workBody').innerHTML=html;
      renderSelBar(); renderNoteBar();
      return;
    }
    // TASK level: per-tab content
    if(ctx.level==='task'){
      const t=ctx.task;
      let content='';
      if(dsTab==='snapshot') content=snapshotContent(t);
      else if(dsTab==='pano') content=`<div class="det-placeholder"><span class="det-ph-title">Pano</span><span class="det-ph-sub">Panorama view — coming next</span></div>`;
      else if(dsTab==='floorplan') content=`<div class="det-placeholder"><span class="det-ph-title">Floor Plan</span><span class="det-ph-sub">Floor plan view — coming next</span></div>`;
      else if(dsTab==='products') content=`<div class="det-placeholder"><span class="det-ph-title">Products</span><span class="det-ph-sub">Product selections — coming next</span></div>`;
      else if(dsTab==='activitynotes') content=activityNotesContent(ctx);
      document.getElementById('workBody').innerHTML=
        `<div class="det"><div class="ds-tabcontent">${content}</div></div>`;
      renderSelBar(); renderNoteBar();
      return;
    }
    // SCOPE / GROUP level — Activity & Notes is built; other tabs still stubbed
    if(dsTab==='activitynotes'){
      document.getElementById('workBody').innerHTML=
        `<div class="det"><div class="ds-tabcontent">${activityNotesContent(ctx)}</div></div>`;
      renderSelBar(); renderNoteBar();
      return;
    }
    document.getElementById('workBody').innerHTML=
      `<div class="det"><div class="ds-tabcontent"><div class="det-placeholder">
        <span class="det-ph-title">${ctx.level==='group'?ctx.room:'Project scope'}</span>
        <span class="det-ph-sub">${ctx.level==='group'?'Group-level detail — coming next':'Scope-level detail — coming next'}</span>
        <span class="det-ph-hint">Select a task to see its full detail view.</span>
      </div></div></div>`;
    renderSelBar(); renderNoteBar();
    return;
  }
  document.getElementById('workBody').innerHTML = renderGallery();
  renderSelBar(); renderNoteBar();
}

/* ── GALLERY RENDER ── */
function photoBox(p){
  const m=photoMeta(p.seed||0);
  return `<div class="gal-photo"
    onclick="openPhoto('${p.room}','${p.kind}','${p.task||''}',${p.seed||0})">
    <div class="gal-anno">
      <span class="gal-anno-who">${m.who} · ${m.role}</span>
      <span class="gal-anno-date">${m.source} ${m.date}</span>
    </div>
  </div>`;
}
function galArrowUp(){ return `<svg viewBox="0 0 12 12" fill="none"><path d="M3 7.5L6 4.5l3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`; }
function galArrowDn(){ return `<svg viewBox="0 0 12 12" fill="none"><path d="M3 4.5L6 7.5l3-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`; }
function galToggle(key,total){
  const open=mediaExpanded.has(key);
  const up=`<svg viewBox="0 0 12 12" fill="none"><path d="M3 7.5L6 4.5l3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  const dn=`<svg viewBox="0 0 12 12" fill="none"><path d="M3 4.5L6 7.5l3-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  return `<button class="gal-toggle" onclick="toggleGalExpand('${key}')"><span>${open?'Collapse':'See all '+total}</span> ${open?up:dn}</button>`;
}
function renderGallery(){
  return renderGalleryDrawing();
}
function renderGalleryLegacy(){
  const rooms = mediaScope==='all' ? ROOMS : [mediaScope];
  const single = mediaScope!=='all';
  let html='<div class="gal">';
  rooms.forEach(room=>{
    const tasks=TASKS.filter(t=>t.room===room);
    if(!tasks.length && mediaScope==='all') return;
    const gPhotos=groupPhotos(room);
    const tPhotos=taskPhotosFor(room,tasks);
    const total=gPhotos.length+tPhotos.length;
    const grpClickable = !single || mediaTask;
    const metaHtml = single
      ? `${gPhotos.length} group ${gPhotos.length===1?'photo':'photos'}<span class="sep">·</span>${tasks.length} ${tasks.length===1?'task':'tasks'}<span class="sep">·</span>${tPhotos.length} task ${tPhotos.length===1?'photo':'photos'}`
      : `${tasks.length} ${tasks.length===1?'task':'tasks'}<span class="sep">·</span>${total} ${total===1?'photo':'photos'}`;
    const secCollapsed = !single && mediaCollapsed.has('sec:'+room);
    html+=`<div class="gal-sec">
      <div class="gal-grphead${!single?' gal-grphead-contact':''}">
        <span class="gal-grpname${grpClickable?' gal-link':''}"${grpClickable?` onclick="openGroupFromGallery('${room}')"`:''}>${room}</span>
        <span class="gal-grpmeta">${metaHtml}</span>
        ${!single?`<span class="gal-grphead-rule"></span><button class="gal-toggle" onclick="toggleGalSection('sec:${room}')"><span>${secCollapsed?'Expand':'Collapse'}</span> ${secCollapsed?galArrowDn():galArrowUp()}</button>`:''}
      </div>`;

    if(single){
      // ── GROUP PHOTOS (row cap at 6, See all / Collapse only when >6) ──
      const gKey='group:'+room;
      const gOpen=mediaExpanded.has(gKey);
      const gOver=gPhotos.length-5;
      const gHasOver=gOver>0;
      const gShowAll=gOpen||!gHasOver;
      const gShown=gShowAll?gPhotos:gPhotos.slice(0,4);
      html+=`<div class="gal-block">
        <div class="gal-subhead">
          <span class="gal-sublabel">Group photos <span class="gal-subcount">${gPhotos.length}</span></span>
          <span class="gal-subrule"></span>
          ${gHasOver?`<button class="gal-toggle" onclick="toggleGalExpand('${gKey}')"><span>${gOpen?'Collapse':'See all '+gPhotos.length}</span> ${gOpen?galArrowUp():galArrowDn()}</button>`:''}
        </div>
        <div class="gal-grid">
          ${gShown.map(photoBox).join('')||'<span class="gal-grpmeta">No group photos</span>'}
          ${(!gShowAll)?`<div class="gal-photo gal-more" onclick="toggleGalExpand('${gKey}')"><span>+${gOver}</span></div>`:''}
        </div>
      </div>`;
      // ── TASK PHOTOS ── (all tasks, or just the drilled task when mediaTask set)
      const drilled = mediaTask ? tasks.find(t=>t.id===mediaTask) : null;
      const withPhotos = (drilled ? [drilled] : tasks).filter(t=>(t.photos||0)>0);
      const taskPhotoCount=withPhotos.reduce((s,t)=>s+(t.photos||0),0);
      const tSecKey='tasksec:'+room;
      const tSecCollapsed=!drilled && mediaCollapsed.has(tSecKey);
      html+=`<div class="gal-block">
        <div class="gal-subhead">
          <span class="gal-sublabel">${drilled?'Task photos · '+drilled.name:'Task photos'} <span class="gal-subcount">${taskPhotoCount}</span></span>
          <span class="gal-subrule"></span>
          ${drilled?'':`<button class="gal-toggle" onclick="toggleGalSection('${tSecKey}')"><span>${tSecCollapsed?'See all '+taskPhotoCount:'Collapse'}</span> ${tSecCollapsed?galArrowDn():galArrowUp()}</button>`}
        </div>`;
      if(!tSecCollapsed){
        if(!withPhotos.length){
          html+=`<span class="gal-grpmeta">No task photos</span>`;
        } else {
          withPhotos.forEach(t=>{
          const ph=photosForTask(t);
          const key='task:'+t.code;
          const open=mediaExpanded.has(key);
          const CAP=8; // smaller task thumbs fit more per row
          const over=ph.length-CAP;
          const showAll=open||over<=0;
          const shown=showAll?ph:ph.slice(0,CAP);
          html+=`<div class="gal-task">
            ${drilled?'':`<div class="gal-task-hd">
              <span class="gal-task-name gal-link" onclick="openTaskFromGallery(${t.id})">${t.name}</span>
            </div>`}
            <div class="gal-grid gal-grid-sm">
              ${shown.map(photoBox).join('')}
              ${(!showAll)?`<div class="gal-photo gal-more" onclick="toggleGalExpand('${key}')"><span>+${over}</span></div>`:''}
              ${(open&&over>0)?`<div class="gal-photo gal-more gal-less" onclick="toggleGalExpand('${key}')"><span>Less</span></div>`:''}
            </div>
          </div>`;
          });
        }
      }
      html+=`</div>`;
    } else {
      // combined single row with expand
      const all=[...gPhotos,...tPhotos];
      // contact-sheet: all photos, collapsible via header toggle
      if(!secCollapsed){
        html+=`<div class="gal-grid gal-grid-contact">
        ${all.map(photoBox).join('')}
      </div>`;
      }
    }
    html+=`</div>`;
  });
  // ── UNSORTED (project photos not assigned to a group or task) ──
  const uPhotos=unsortedPhotos();
  if(uPhotos.length){
    if(!single){
      // contact-sheet scope view — match group format
      const uSecCollapsed = mediaCollapsed.has('sec:unsorted');
      html+=`<div class="gal-sec gal-sec-unsorted">
        <div class="gal-grphead gal-grphead-contact">
          <span class="gal-grpname">Unsorted</span>
          <span class="gal-grpmeta">${uPhotos.length} ${uPhotos.length===1?'photo':'photos'} · not assigned</span>
          <span class="gal-grphead-rule"></span>
          <button class="gal-toggle" onclick="toggleGalSection('sec:unsorted')"><span>${uSecCollapsed?'Expand':'Collapse'}</span> ${uSecCollapsed?galArrowDn():galArrowUp()}</button>
        </div>
        ${uSecCollapsed?'':`<div class="gal-grid gal-grid-contact">${uPhotos.map(photoBox).join('')}</div>`}
      </div>`;
    } else {
      // single-group view — capped row with +N
      const uKey='unsorted';
      const uOpen=mediaExpanded.has(uKey);
      const uOver=uPhotos.length-5;
      const uHasOver=uOver>0;
      const uShowAll=uOpen||!uHasOver;
      const uShown=uShowAll?uPhotos:uPhotos.slice(0,4);
      html+=`<div class="gal-sec gal-sec-unsorted">
        <div class="gal-grphead">
          <span class="gal-grpname">Unsorted</span>
          <span class="gal-grpmeta">${uPhotos.length} ${uPhotos.length===1?'photo':'photos'} · not assigned</span>
        </div>
        <div class="gal-block">
          <div class="gal-subhead">
            <span class="gal-sublabel">Photos <span class="gal-subcount">${uPhotos.length}</span></span>
            <span class="gal-subrule"></span>
            ${uHasOver?`<button class="gal-toggle" onclick="toggleGalExpand('${uKey}')"><span>${uOpen?'Collapse':'See all '+uPhotos.length}</span> ${uOpen?galArrowUp():galArrowDn()}</button>`:''}
          </div>
          <div class="gal-grid">
            ${uShown.map(photoBox).join('')}
            ${(!uShowAll)?`<div class="gal-photo gal-more" onclick="toggleGalExpand('${uKey}')"><span>+${uOver}</span></div>`:''}
          </div>
        </div>
      </div>`;
    }
  }
  html+='</div>';
  return html;
}

/* ══ DETAILS TAB (Drawing Set only) ══ level-aware: scope / group / task */
function currentDetailLevel(){
  if(selId!=null && TASKS.some(t=>t.id===selId)) return {level:'task', task:TASKS.find(t=>t.id===selId)};
  if(mediaScope!=='all') return {level:'group', room:mediaScope};
  return {level:'scope'};
}
function detRow(label,val){ return val==null||val===''?'':`<div class="det-kv"><span class="det-k">${label}</span><span class="det-v">${val}</span></div>`; }
function money(str){ return Number(String(str||'').replace(/[^0-9.]/g,''))||0; }
function fmtMoney(n){ return '$'+Math.round(n).toLocaleString('en-US'); }

/* pinned header card — task identity, status/flags, contractor, figures */
function taskHeaderCard(t){
  const st=STATUS[t.status]||{label:t.status,cls:''};
  const shopped=!!t.product;
  const fig=(v)=> shopped ? `<span class="det-fig-v">${v}</span>` : `<span class="det-fig-v det-fig-empty">—</span>`;
  const gc=t.gc||'Unassigned';
  const trade=TRADE_BY_GC[gc]||'';
  return `<div class="det-card">
    <div class="det-card-hd">
      <div class="det-card-titles">
        <span class="det-grpassoc">${t.room} · ${t.code}</span>
        <span class="det-taskname">${t.name}</span>
        ${t.opt?`<span class="det-taskopt">${t.opt}</span>`:''}
        <div class="det-gc">
          <span class="det-gc-k">Contractor</span>
          <span class="det-gc-name${gc==='Unassigned'?' det-warn':''}">${gc}</span>
          ${trade?`<span class="det-gc-trade">${trade}</span>`:''}
        </div>
      </div>
      <div class="det-card-right">
        <div class="det-attn">
          <span class="det-status ${st.cls}">${st.label}</span>
          ${(t.flags||[]).map(f=>{const m=FLAGS[f];return m?`<span class="det-flag ${m.cls}"><span class="det-flag-dot"></span>${m.label}</span>`:'';}).join('')}
          ${(t.mods||[]).map(md=>{const m=(PROJECT_MODS.find(x=>x.id===md));return m?`<span class="det-mod">${m.label}</span>`:'';}).join('')}
        </div>
        <div class="det-card-figs">
          <div class="det-fig"><span class="det-fig-k">Unit price</span>${fig(t.rate)}</div>
          <div class="det-fig"><span class="det-fig-k">Labor</span>${fig(t.pcost)}</div>
          <div class="det-fig"><span class="det-fig-k">Qty</span>${fig(t.qty)}</div>
          <div class="det-fig"><span class="det-fig-k">Total</span>${fig(t.cost)}</div>
        </div>
      </div>
    </div>
  </div>`;
}

/* SNAPSHOT tab — measurements/product/contractor/budget, a slice of photos, a slice of activity */
function snapshotContent(t){
  const meta=ROOM_META[t.room]||{dims:'—',light:'—'};
  const dimsNoCeiling=(meta.dims||'').replace(/\s*·\s*\d+['’]?\s*ceiling/i,'');
  const photos=photosForTask(t); const nTask=photos.length;
  const gc=t.gc||'Unassigned';
  const trade=TRADE_BY_GC[gc]||'';
  const groupTotal=TASKS.filter(x=>x.room===t.room).reduce((s,x)=>s+money(x.cost),0);
  const taskShare=money(t.cost);
  const strip=`<div class="det-strip">
    <div class="det-strip-cell det-w-dims">
      <span class="det-strip-k">Room measurements</span>
      <span class="det-strip-v">${dimsNoCeiling}</span>
      <span class="det-strip-v2">${t.room} · all tasks</span>
    </div>
    <div class="det-strip-cell det-w-product">
      <span class="det-strip-k">Product</span>
      ${t.product?`<div class="det-prod">
        <div class="det-prod-thumb">${imgIconSVG()}</div>
        <div class="det-prod-info">
          <span class="det-strip-v det-prod-name">${t.product}</span>
          ${t.sku?`<span class="det-strip-v2">${t.sku}</span>`:''}
        </div>
      </div>`:`<span class="det-strip-v det-strip-empty">—</span>`}
    </div>
    <div class="det-strip-cell det-w-gc">
      <span class="det-strip-k">Contractor</span>
      <span class="det-strip-v${gc==='Unassigned'?' det-warn':''}">${gc}</span>
      ${trade?`<span class="det-strip-v2">${trade}</span>`:''}
    </div>
    <div class="det-strip-cell det-w-budget">
      <span class="det-strip-k">Budget</span>
      <span class="det-strip-v det-budget-task${t.product?'':' det-strip-empty'}">${t.product?fmtMoney(taskShare):'—'}</span>
      <span class="det-strip-v2">${fmtMoney(groupTotal)} group</span>
    </div>
  </div>`;
  // photos slice → jumps to the Photos tab for "view all"
  const tile=(p)=>{
    const m=photoMeta(p.seed||0);
    return `<div class="det-ec" onclick="openPhoto('${p.room}','${p.kind}','${p.task||''}',${p.seed||0})">
      <div class="det-ec-img"><span class="det-ec-badge det-ec-task">Task</span>${imgIconSVG()}
        <div class="ds-hover"><div class="ds-hover-info"><span class="ds-hover-who">${m.who}</span><span class="ds-hover-sub">${m.source==='Uploaded'?'Uploaded':'Captured'} · ${m.date}</span></div></div>
      </div>
    </div>`;
  };
  const shown=photos.slice(0,6).map(tile).join('');
  const ecSection=`<div class="det-section">
    <div class="det-sec-hd"><span class="det-sec-title">Photos</span>
      <span class="det-sec-rule"></span>
      <span class="det-sec-count">${nTask} task ${nTask===1?'photo':'photos'}</span>
    </div>
    <div class="det-ecgrid">${nTask ? shown : '<div class="det-empty">No photos yet.</div>'}</div>
  </div>`;
  // activity slice (first 4) → tabs across the top navigate to the full feed
  const tl=taskTimeline(t).slice(0,4);
  const feed=activityFeedRows(tl);
  const actSection=`<div class="det-section">
    <div class="det-sec-hd"><span class="det-sec-title">Recent activity</span>
      <span class="det-sec-rule"></span>
    </div>
    <div class="det-feed">${feed}</div>
  </div>`;
  return strip+ecSection+actSection;
}

/* ACTIVITY & NOTES tab — search + filter, no section header */
let actSearch='';
let actFilter='all'; // all | activity | notes
function setActFilter(f){ actFilter=f; renderWork(); }
function onActSearch(v){
  actSearch=v;
  const ctx=currentDetailLevel();
  const feed=document.getElementById('actFeed');
  if(feed){
    const filtered=filterTimeline(levelTimeline(ctx));
    feed.innerHTML = filtered.length?activityFeedRows(filtered, ctx.level==='task'):'<div class="det-empty">No matching activity.</div>';
  }
}
function filterTimeline(tl){
  const q=actSearch.trim().toLowerCase();
  return tl.filter(e=>{
    if(actFilter==='activity' && e.kind!=='event') return false;
    if(actFilter==='notes' && e.kind!=='note') return false;
    if(!q) return true;
    const hay=[(e.who||''),(e.verb||''),(e.body||''),(e.when||'')].join(' ').toLowerCase();
    return hay.includes(q);
  });
}
function activityNotesContent(ctx){
  const tl=levelTimeline(ctx);
  const filtered=filterTimeline(tl);
  const chips=[['all','All'],['activity','Activity'],['notes','Notes']];
  const editable = ctx.level==='task';   // inline edit/delete only in the task's own feed
  return `<div class="det-section det-section-act">
    <div class="act-tools">
      <div class="act-search">
        ${searchSVG()}
        <input class="act-search-input" type="text" placeholder="Search activity and notes" value="${actSearch.replace(/"/g,'&quot;')}" oninput="onActSearch(this.value)">
      </div>
      <div class="act-filters">
        ${chips.map(([k,label])=>`<button class="act-chip${actFilter===k?' active':''}" onclick="setActFilter('${k}')">${label}</button>`).join('')}
      </div>
    </div>
    <div class="det-feed" id="actFeed">${filtered.length?activityFeedRows(filtered, editable):'<div class="det-empty">No matching activity.</div>'}</div>
  </div>`;
}
/* pinned note composer at the panel bottom — only on the Activity & Notes tab */
function renderNoteBar(){
  const bar=document.getElementById('noteBar');
  if(!bar) return;
  const ctx=currentDetailLevel();
  const show = galleryLayout==='drawing' && dsTab==='activitynotes';
  if(!show){ bar.classList.remove('show'); bar.setAttribute('aria-hidden','true'); bar.innerHTML=''; return; }
  const ph = ctx.level==='task' ? 'Add a note to this task…'
           : ctx.level==='group' ? `Add a note to ${ctx.room}…`
           : 'Add a note to the scope…';
  bar.setAttribute('aria-hidden','false');
  bar.innerHTML=`
    <textarea class="nc-input" id="noteInput" placeholder="${ph}"></textarea>
    <div class="nc-row">
      <div class="nc-vises">
        <button class="nc-vis${noteVis==='public'?' on':''}" data-v="public" onclick="setNoteVis('public')">Public</button>
        <button class="nc-vis${noteVis==='internal'?' on':''}" data-v="internal" onclick="setNoteVis('internal')">Internal</button>
      </div>
      <button class="nc-add" onclick="addNote()">Add note</button>
    </div>`;
  bar.classList.add('show');
}
function searchSVG(){ return `<svg class="act-search-ico" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.4"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>`; }

/* shared feed row renderer — milestones (heavier), rework, quiet ticks, note cards.
   editable=true (task's own feed) shows edit/delete + inline edit. */
function activityFeedRows(tl, editable){
  return tl.map(e=>{
    const who = (e.who||'').split(' · ')[0];
    const src = e.src ? `<span class="det-fx-src">${e.src}</span>` : '';
    if(e.kind==='note'){
      const badge=e.vis==='internal'?`<span class="det-tl-badge det-int">Internal</span>`:`<span class="det-tl-badge det-pub">Public</span>`;
      if(editable && editNoteId===e.id){
        return `<div class="det-fx det-fx-note">
          <span class="det-fx-av det-fx-av-note">${noteIcon()}</span>
          <div class="det-fx-card det-fx-editing">

      </div>`;
    if(!collapsed){
      // group-level photos (the room's own, not tied to a task)
      if(gPhotos.length){
        s+=`<div class="ds-grpsub">Group photos · ${gPhotos.length}</div>`;
        s+=`<div class="ds-frame ds-frame-tight"><div class="ds-grid">${gPhotos.map((p,i)=>drawingPhotoBox(p,i+1)).join('')}</div></div>`;
      }
      // one sub-section per task
      tasks.forEach(t=>{
        const tp=photosForTask(t);
        s+=`<div class="ds-taskhead${tp.length?'':' ds-empty'}">
              <div class="ds-taskhead-top">
                <span class="ds-tasklabel gal-link" onclick="openTaskFromGallery(${t.id})">${t.name}</span>
                ${tp.length?`<span class="ds-taskmeta">${tp.length} ${tp.length===1?'photo':'photos'}</span>`:`<span class="ds-emptyflag">No photos</span>`}
                <span class="ds-taskrule"></span>
                <button class="ds-add ds-add-sm" onclick="openAddModal({kind:'task',room:'${room}',task:'${t.code}'})">${plusSVG()} Add</button>
              </div>
              ${t.opt?`<div class="ds-taskopt">${t.opt}</div>`:''}
            </div>`;
        if(tp.length){
          s+=`<div class="ds-frame ds-frame-tight"><div class="ds-grid">${tp.map((p,i)=>drawingPhotoBox(p,i+1)).join('')}</div></div>`;
        }
      });
    }
    s+=`</div>`;
    return s;
  };
  rooms.forEach(room=>{ html+=renderSheet(room); });
  if(!single) html+=titleBlock;
  html+='</div>';
  return html;
}

/* ══ RAILS VARIANT ══ every scope is a horizontal rail (larger thumbs, hover arrows) */
function railPhotoBox(p){
  const m=photoMeta(p.seed||0);
  return `<div class="rail-photo" onclick="openPhoto('${p.room}','${p.kind}','${p.task||''}',${p.seed||0})">
    <div class="gal-anno">
      <span class="gal-anno-who">${m.who} · ${m.role}</span>
      <span class="gal-anno-date">${m.source} ${m.date}</span>
    </div>
  </div>`;
}
function rail(labelHtml, photos, seeAllKey){
  const arrows = `<button class="rail-arrow rail-arrow-l" onclick="railScroll(this,-1)" aria-label="Scroll left">${galLeft()}</button><button class="rail-arrow rail-arrow-r" onclick="railScroll(this,1)" aria-label="Scroll right">${galRight()}</button>`;
  return `<div class="rail-block">
    ${labelHtml?`<div class="rail-subhead">${labelHtml}</div>`:''}
    <div class="rail-wrap">
      ${photos.length>4?arrows:''}
      <div class="rail-track">
        ${photos.map(railPhotoBox).join('')||'<span class="gal-grpmeta">No photos</span>'}
      </div>
    </div>
  </div>`;
}
function galLeft(){ return `<svg viewBox="0 0 16 16" fill="none"><path d="M10 3l-5 5 5 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>`; }
function galRight(){ return `<svg viewBox="0 0 16 16" fill="none"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>`; }
function renderGalleryRails(){
  const rooms = mediaScope==='all' ? ROOMS : [mediaScope];
  const single = mediaScope!=='all';
  let html='<div class="gal gal-rails">';
  rooms.forEach(room=>{
    const tasks=TASKS.filter(t=>t.room===room);
    if(!tasks.length && mediaScope==='all') return;
    const gPhotos=groupPhotos(room);
    const tPhotos=taskPhotosFor(room,tasks);
    const total=gPhotos.length+tPhotos.length;
    const grpClickable = !single || mediaTask;
    html+=`<div class="gal-sec">
      <div class="gal-grphead">
        <span class="gal-grpname${grpClickable?' gal-link':''}"${grpClickable?` onclick="openGroupFromGallery('${room}')"`:''}>${room}</span>
        <span class="gal-grpmeta">${tasks.length} ${tasks.length===1?'task':'tasks'}<span class="sep">·</span>${total} ${total===1?'photo':'photos'}</span>
      </div>`;
    if(single){
      // group photos rail
      html+=rail(`<span class="gal-sublabel">Group photos <span class="gal-subcount">${gPhotos.length}</span></span>`, gPhotos);
      // per-task rails (or just drilled task)
      const drilled = mediaTask ? tasks.find(t=>t.id===mediaTask) : null;
      const withPhotos = (drilled ? [drilled] : tasks).filter(t=>(t.photos||0)>0);
      withPhotos.forEach(t=>{
        const ph=photosForTask(t);
        html+=rail(`<span class="rail-task-name gal-link" onclick="openTaskFromGallery(${t.id})">${t.name}</span> <span class="gal-subcount">${ph.length}</span>`, ph);
      });
    } else {
      // scope-all: one combined rail per group
      html+=rail('', [...gPhotos,...tPhotos]);
    }
    html+=`</div>`;
  });
  // unsorted rail
  const uPhotos=unsortedPhotos();
  if(uPhotos.length){
    html+=`<div class="gal-sec gal-sec-unsorted">
      <div class="gal-grphead">
        <span class="gal-grpname">Unsorted</span>
        <span class="gal-grpmeta">${uPhotos.length} ${uPhotos.length===1?'photo':'photos'} · not assigned</span>
      </div>
      ${rail('', uPhotos)}
    </div>`;
  }
  html+='</div>';
  return html;
}
function railScroll(btn, dir){
  const track=btn.parentElement.querySelector('.rail-track');
  if(track) track.scrollBy({left:dir*track.clientWidth*0.8, behavior:'smooth'});
}
const VARIANT_DEFS = {
  drawing: 'Drawing Set',
};
// which variants show per phase key (single Drawing Set layout — no toggle needed)
const PHASE_VARIANTS = {
  create:  [],
  submit:  [],
  review:  [],
  progress:[],
  closeout:[],
};
function variantsForPhase(){
  const key = PHASES[currentPhase] ? PHASES[currentPhase].key : 'create';
  return PHASE_VARIANTS[key] || [];
}
function renderVariantsBar(){
  const allowed = variantsForPhase();
  // if current layout isn't allowed on this phase, switch to the first allowed
  if(allowed.length && !allowed.includes(galleryLayout)) galleryLayout = allowed[0];
  const el = document.getElementById('variantsTabs');
  if(!el) return;
  const bar = el.closest('.variants-bar');
  if(bar) bar.style.display = allowed.length ? '' : 'none';
  el.innerHTML = allowed.map(v=>
    `<button class="variants-tab${galleryLayout===v?' active':''}" onclick="setGalleryLayout('${v}')">${VARIANT_DEFS[v]}</button>`
  ).join('');
}
function setGalleryLayout(layout){
  galleryLayout=layout;
  renderVariantsBar();
  renderWorkHdr();
  renderWork();
}
function toggleGalExpand(key){
  mediaExpanded.has(key)?mediaExpanded.delete(key):mediaExpanded.add(key);
  renderWork();
}
function toggleGalSection(key){
  mediaCollapsed.has(key)?mediaCollapsed.delete(key):mediaCollapsed.add(key);
  renderWork();
}
function openPhoto(room,kind,task,seed){
  const mt=document.getElementById('mdTitle');
  const mb=document.getElementById('mdBody');
  const m=photoMeta(seed);
  mt.textContent=(kind==='unsorted'?'Unsorted':room)+' — Photo';
  const src = kind==='task' ? `Task photo · ${task}` : (kind==='unsorted' ? 'Unsorted · not assigned' : `Group photo · ${room}`);
  mb.innerHTML=`<div class="mdphoto"><span class="mdphoto-note">Use full size modal from closeout work</span></div>
    <span class="mdphoto-meta"><b>${m.who} · ${m.role}</b></span>
    <span class="mdphoto-meta">${m.source} ${m.date} · ${src}</span>`;
  document.getElementById('modal').classList.add('open','modal-full');
  document.getElementById('modal-scrim').classList.add('open');
}

/* ── ADD PHOTOS MODAL ── opens an upload surface; confirm feeds addPhotosTo (simulated) */
let addTarget=null;      // where staged photos will land
let addStaged=0;         // count of staged (pending) placeholder photos
function targetLabel(target){
  if(target.kind==='unsorted') return 'Unsorted';
  if(target.kind==='group') return target.room+' · Group photos';
  if(target.kind==='task'){ const t=TASKS.find(x=>x.code===target.task); return target.room+' · '+(t?t.name:'Task'); }
  return '';
}
function openAddModal(target){
  addTarget=target; addStaged=0;
  document.getElementById('mdTitle').textContent='Add photos';
  renderAddModalBody();
  document.getElementById('modal').classList.add('open');
  document.getElementById('modal-scrim').classList.add('open');
}
function renderAddModalBody(){
  const mb=document.getElementById('mdBody');
  const staged=addStaged>0
    ? `<div class="up-staged">
         <div class="up-staged-hd"><span>${addStaged} ${addStaged===1?'photo':'photos'} ready</span>
           <button class="up-clear" onclick="clearStaged()">Clear</button></div>
         <div class="up-thumbs">${Array.from({length:Math.min(addStaged,12)},()=>`<div class="up-thumb"></div>`).join('')}${addStaged>12?`<div class="up-thumb up-more">+${addStaged-12}</div>`:''}</div>
       </div>`
    : '';
  mb.innerHTML=`
    <div class="up-dest">Adding to <b>${targetLabel(addTarget)}</b></div>
    <div class="up-zone" id="upZone" onclick="stageFiles()"
         ondragover="event.preventDefault();this.classList.add('drag')"
         ondragleave="this.classList.remove('drag')"
         ondrop="event.preventDefault();this.classList.remove('drag');stageFiles()">
      <div class="up-zone-ico">${plusSVG()}</div>
      <div class="up-zone-main">Drop photos here or click to browse</div>
      <div class="up-zone-sub">JPG, PNG, HEIC · up to 25 MB each</div>
    </div>
    ${staged}
    <div class="up-foot">
      <button class="up-cancel" onclick="closeModal()">Cancel</button>
      <button class="up-confirm" ${addStaged?'':'disabled'} onclick="confirmAdd()">Add ${addStaged||''} ${addStaged? (addStaged===1?'photo':'photos'):'photos'}</button>
    </div>`;
}
/* simulate picking files: stage a batch of placeholders */
function stageFiles(){ addStaged += 3 + Math.floor(Math.random()*4); renderAddModalBody(); }
function clearStaged(){ addStaged=0; renderAddModalBody(); }
function confirmAdd(){
  if(!addStaged) return;
  const n=addStaged, target=addTarget;
  closeModal();
  addPhotosTo(target, n);   // real mutation into the store
  addStaged=0; addTarget=null;
}
function setMediaScope(scope){
  mediaScope=scope;
  mediaTask=null;   // selecting a group clears any task drill-in
  document.querySelectorAll('.grp').forEach(g=>g.classList.toggle('media-sel',g.dataset.grp===scope));
  const hdr=document.querySelector('.sb-hdr');
  if(hdr) hdr.classList.toggle('media-sel',scope==='all');
  renderWork();
}
/* return the gallery to full project scope and drop any left-panel drill selection */
function clearMediaScope(){
  const hadTask = mediaTask;
  mediaScope='all';
  mediaTask=null;
  // deselect on the left: a drilled task had been opened + highlighted
  if(hadTask){ openIds.delete(hadTask); if(selId===hadTask) selId=null; }
  document.querySelectorAll('.grp').forEach(g=>g.classList.remove('media-sel'));
  const hdr=document.querySelector('.sb-hdr'); if(hdr) hdr.classList.remove('media-sel');
  renderSidebar();
  renderWork();
}
function bcArrow(){ return `<svg viewBox="0 0 14 14" fill="none"><path d="M9 3L5 7l4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`; }
/* gallery → left panel wiring */
function openGroupFromGallery(room){
  // select group for media (right filters) and open it on the left
  if(collapsedGrps) collapsedGrps.delete(room);
  setMediaScope(room);
  renderSidebar();
  const el=document.querySelector(`.grp[data-grp="${room}"]`);
  if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
}
function openTaskFromGallery(id){
  const t=TASKS.find(x=>x.id===id); if(!t) return;
  // drill the right panel into this single task
  mediaScope=t.room;
  mediaTask=id;
  document.querySelectorAll('.grp').forEach(g=>g.classList.toggle('media-sel',g.dataset.grp===t.room));
  const hdr=document.querySelector('.sb-hdr'); if(hdr) hdr.classList.remove('media-sel');
  // single selection on the left — close any other open task
  openIds.clear();
  openIds.add(id);
  selId=id;
  if(collapsedGrps) collapsedGrps.delete(t.room);
  renderSidebar();
  renderWork();
  const el=document.querySelector(`.task[data-tid="${id}"]`);
  if(el) el.scrollIntoView({behavior:'smooth',block:'center'});
}
function setVariant(v){
  variant=v;
  document.querySelectorAll('.ctx-v').forEach(b=>b.classList.toggle('active',b.dataset.variant===v));
  renderWorkHdr(); renderWork();
}

/* ════════════ RENDER ALL ════════════ */
function renderAll(){ renderFilter(); renderSidebar(); syncApproveBtn(); renderWork(); }

/* ════════════ LIFECYCLE PHASES ════════════ */
const PHASES = [
  {key:'create',    name:'Create',          sub:'Draft',                cta:'Submit for Review',  explainB:'Create Mode:',         explain:'anyone with access can build the scope here. Lock by submitting for review.'},
  {key:'submit',    name:'Submit',          sub:'Locked',               cta:'Begin Review',       explainB:'Submit Mode:',         explain:'scope is locked and queued. Send it to admin for review.', link:'Recall to Draft', linkTo:0},
  {key:'review',    name:'Review',          sub:'Admin reviewing',      cta:'Publish Scope',      explainB:'Review Mode:',         explain:'admin is reviewing the submitted scope. Approve to publish, or request edits.'},
  {key:'progress',  name:'Progress',        sub:'Track work',           cta:'Begin Finalize',     explainB:'Progress:',            explain:'tracks work as it happens. Change orders can be created when needed.'},
  {key:'closeout',  name:'Finalize',        sub:'Compare before/after', cta:'Complete Project',   explainB:'Finalize:',            explain:'compare before and after, then finalize the project.'},
];
let currentPhase = 0; // Create

/* ── Demo empty state (pre-Edit / no scope yet). Toggled by clicking the address. ── */
let emptyState = false;
function addMediaTo(target){
  toast(target==='Scope'?'Add photos to the whole project':`Add photos to ${target}`);
}
function toggleEmpty(){
  emptyState = !emptyState;
  renderStepper();
  renderSidebar();
  renderWork();
  const ex=document.getElementById('stExplain');
  if(ex){
    if(emptyState){
      ex.innerHTML=`<b>Empty state:</b> no scope has been created yet.`;
    }else{
      setPhase(currentPhase);
    }
  }
}
function renderStepper(){
  const el=document.getElementById('stepper');
  const checkSVG=`<svg viewBox="0 0 14 14" fill="none"><path d="M2.5 7.5l3 3 6-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  const arw=`<span class="step-arw"><svg viewBox="0 0 8 12" fill="none"><path d="M1.5 1l5 5-5 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>`;
  el.innerHTML = PHASES.map((p,i)=>{
    const state = emptyState ? '' : (i<currentPhase?'done':(i===currentPhase?'current':''));
    const mark = (!emptyState && i<currentPhase)?checkSVG:(i+1);
    return `<div class="step ${state}" onclick="setPhase(${i})">
      <span class="step-mark">${mark}</span>
      <span class="step-txt"><span class="step-name">${p.name}</span><span class="step-sub">${p.sub}</span></span>
    </div>`;
  }).join(arw);
}
function setPhase(i){
  currentPhase=i;
  renderStepper();
  // explainer
  const p=PHASES[i];
  const ex=document.getElementById('stExplain');
  if(ex){
    ex.innerHTML=`<b>${p.explainB}</b> ${p.explain}`;
  }
  const slot=document.getElementById('stLinkSlot');
  if(slot){
    slot.innerHTML = p.link ? `<button class="st-link" onclick="setPhase(${p.linkTo})"><span>${p.link}</span></button>` : '';
  }
  // CTA
  syncApproveBtn();
  // variants bar is phase-specific
  renderVariantsBar();
  renderWork();
}

/* ════════════ TOAST ════════════ */
let toastT;
function toast(msg, action){
  const el=document.getElementById('toast');
  el.innerHTML='';
  const span=document.createElement('span'); span.textContent=msg; el.appendChild(span);
  if(action && action.label && action.fn){
    const btn=document.createElement('button');
    btn.className='toast-action'; btn.textContent=action.label;
    btn.onclick=()=>{ action.fn(); el.classList.remove('show'); };
    el.appendChild(btn);
  }
  el.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'), action?4000:2000);
}

/* ════════════ RESIZE ════════════ */
(function(){
  const handle=document.getElementById('handle');
  const body=document.querySelector('.body');
  const sidebar=document.querySelector('.sidebar');
  const DEFAULT=38,MIN=24,MAX=60; let dragging=false;
  function setPct(p){ p=Math.min(MAX,Math.max(MIN,p)); sidebar.style.flexBasis=p+'%'; }
  function onMove(e){ if(!dragging)return; const r=body.getBoundingClientRect(); const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left; setPct((x/r.width)*100); }
  function stop(){ if(!dragging)return; dragging=false; handle.classList.remove('dragging'); document.body.classList.remove('col-resizing'); }
  function start(e){ dragging=true; handle.classList.add('dragging'); document.body.classList.add('col-resizing'); e.preventDefault(); }
  handle.addEventListener('mousedown',start);
  handle.addEventListener('touchstart',start,{passive:false});
  window.addEventListener('mousemove',onMove);
  window.addEventListener('touchmove',onMove,{passive:false});
  window.addEventListener('mouseup',stop);
  window.addEventListener('touchend',stop);
  handle.addEventListener('dblclick',()=>{ sidebar.style.flexBasis=DEFAULT+'%'; });
})();

/* ════════════ INIT ════════════ */
seedPhotos();
renderStepper();
renderVariantsBar();
renderWorkHdr();
renderAll();
</script>
