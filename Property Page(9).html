  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ily:'Maxeville';font-weight:600;font-size:18px;letter-spacing:-.01em;color:#1A1A1A;white-space:nowrap}\n  .prow{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:6px 0}\n  .rv{font-family:'Circular XX';font-weight:500;font-size:15px;color:#1A1A1A;text-align:right}\n\n  /* cards */\n  .card{background:#FFFFFF;border:1px solid #DDD6C8}\n  .card-ink{border-color:#1A1A1A}\n  .card-h{display:flex;align-items:center;justify-content:space-between;padding:17px 22px;border-bottom:1px solid #ece5d6}\n\n  /* buttons */\n  .btn{font-family:'Maxeville Construct';font-weight:700;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;border-radius:1px;padding:8px 14px;display:inline-flex;align-items:center;gap:7px;line-height:1;white-space:nowrap}\n  .btn-bd{background:#FFFFFF;border:1px solid #1A1A1A;color:#1A1A1A}\n  .btn-cta{background:#FDFF86;border:1px solid #1A1A1A;color:#1A1A1A}\n  .btn-dark{background:#1A1A1A;border:1px solid #1A1A1A;color:#FFFDF8}\n\n  /* highlighter text-link */\n  .hl{position:relative;display:inline-flex;align-items:center;gap:6px;color:#1A1A1A;font-family:'Circular XX';font-weight:600;font-size:12.5px;text-decoration:none;cursor:pointer;background:none;border:none;padding:0;white-space:nowrap}\n  .hl::before{content:\"\";position:absolute;left:-3px;right:-3px;bottom:1px;height:7px;background:#FDFF86;transform:rotate(-1.4deg);z-index:0}\n  .hl>span{position:relative;z-index:1}\n\n  /* pills */\n  .pill{display:inline-flex;align-items:center;gap:6px;font-family:'Maxeville Construct';font-weight:700;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;padding:5px 9px;border:1px solid #DDD6C8;color:#57544b;background:#fff;border-radius:1px;white-space:nowrap}\n  .dot{width:5px;height:5px;border-radius:50%;flex:none}\n  .pill-red{border-color:#C0443A;color:#C0443A}\n  .st-green{border-color:#bcd7c4;color:#3f7a50;background:#eaf3ec}\n  .st-blue{border-color:#c2d3df;color:#3E6B8B;background:#e9f0f5}\n  .st-red{border-color:#e3b9b4;color:#C0443A;background:#f8ebe9}\n  .st-gray{border-color:#d8d0bf;color:#7D7469;background:#f0ece2}\n\n  /* inputs */\n  .inp{width:100%;border:1px solid #DDD6C8;background:#FFFDF8;font-family:'Circular XX';font-weight:500;font-size:15px;color:#1A1A1A;padding:9px 11px;border-radius:1px;outline:none}\n  .inp:focus{border-color:#1A1A1A;background:#fff}\n\n  .money{font-family:'Maxeville';font-weight:700;color:#1A1A1A}\n  .th{font-family:'Maxeville Construct';font-weight:700;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:#57544b;padding:13px 16px;white-space:nowrap;background:#E4DCCB;display:flex;align-items:center}\n  .td{padding:14px 16px;border-top:1px solid #ece5d6;font-family:'Circular XX';font-weight:500;font-size:13.5px;color:#1A1A1A;display:flex;align-items:center;min-width:0}\n  .throw{display:grid;grid-template-columns:minmax(0,2.4fr) 1fr 150px minmax(0,1.4fr) .95fr .95fr .85fr 44px;border-bottom:1.5px solid #1A1A1A}\n  .trow{display:grid;grid-template-columns:minmax(0,2.4fr) 1fr 150px minmax(0,1.4fr) .95fr .95fr .85fr 44px;align-items:stretch}\n  .trow:hover{background:#FBF8F0}\n\n  .av{width:32px;height:32px;border:1px solid #4a4a4a;background:#3a3a3a;color:#e8e4da;display:flex;align-items:center;justify-content:center;font-family:'Maxeville Construct';font-weight:700;font-size:11px;border-radius:1px}\n\n  .ph{background-color:#DDD6C8;background-image:repeating-linear-gradient(135deg,rgba(26,26,26,.05) 0 11px,transparent 11px 22px);display:flex;align-items:center;justify-content:center;color:#7D7469;font-family:'Maxeville Construct';font-weight:700;font-size:10px;letter-spacing:.18em;text-align:center}\n  .pcount{position:absolute;top:12px;right:12px;background:#FFFDF8;border:1px solid #1A1A1A;border-radius:1px;padding:5px 10px;font-family:'Maxeville Construct';font-weight:700;font-size:12px;display:flex;align-items:center;gap:7px}\n\n  .menu{position:absolute;right:0;top:30px;background:#fff;border:1px solid #1A1A1A;box-shadow:6px 7px 0 -2px rgba(26,26,26,.12);width:190px;z-index:20;padding:4px}\n  .menu.up{top:auto;bottom:30px}\n  .mi{display:block;width:100%;text-align:left;border:none;background:none;cursor:pointer;font-family:'Circular XX';font-weight:500;font-size:13.5px;color:#1A1A1A;padding:10px 12px}\n  .mi:hover{background:#FDFF86}\n  .mi-red{color:#C0443A}\n  .mi-red:hover{background:#f7e4e1}\n  .optrow{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:none;background:none;cursor:pointer;font-family:'Circular XX';font-weight:500;font-size:13px;color:#1A1A1A;padding:8px 10px;border-radius:1px;margin-bottom:1px}\n  .optrow:hover{background:#f5f1e4}\n  .optrow.on{background:#FBFBC6}\n  .scrim{position:fixed;inset:0;background:rgba(26,26,26,.34);z-index:50;animation:scrimIn .2s ease}\n  .drawer{position:fixed;top:0;right:0;height:100vh;width:456px;max-width:100%;background:#FFFDF8;border-left:1px solid #1A1A1A;z-index:51;display:flex;flex-direction:column;box-shadow:-16px 0 44px -22px rgba(0,0,0,.45);animation:drawerIn .24s ease}\n  @keyframes drawerIn{from{transform:translateX(100%)}to{transform:translateX(0)}}\n  @keyframes scrimIn{from{opacity:0}to{opacity:1}}\n  .fset{position:relative;border:1px solid #DDD6C8;border-radius:2px;padding:13px 13px 11px}\n  .fset>.leg{position:absolute;top:-7px;left:11px;background:#FFFFFF;padding:0 6px}\n  .addin{width:100%;border:none;background:none;outline:none;font-family:'Circular XX';font-weight:500;font-size:14px;color:#1A1A1A;padding:1px 1px 3px}\n  .addin::placeholder{color:#a8a08d}\n  .chip{display:inline-flex;align-items:center;background:#EDE5D4;border:1px solid #DDD6C8;border-radius:1px;padding:6px 10px;font-family:'Circular XX';font-weight:500;font-size:12.5px;color:#1A1A1A}\n  .chiprow{display:flex;flex-wrap:wrap;gap:7px}\n  .modal-scrim{position:fixed;inset:0;background:rgba(26,26,26,.36);z-index:60;display:flex;align-items:center;justify-content:center;padding:24px;animation:scrimIn .2s ease}\n  .modal{width:720px;max-width:100%;max-height:96vh;background:#FFFFFF;border:1px solid #1A1A1A;box-shadow:0 26px 64px -26px rgba(0,0,0,.5);display:flex;flex-direction:column;animation:modalIn .22s ease}\n  @keyframes modalIn{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}\n  .fld{width:100%;border:none;background:none;outline:none;font-family:'Circular XX';font-weight:400;font-size:15px;color:#1A1A1A;padding:1px 0}\n  .fld::placeholder{color:#a8a08d;font-weight:400}\n  select.fld{cursor:pointer}\n  .g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}\n  .opt{color:#a8a08d}\n  .btn-cta.cta-off,.btn-dark.cta-off{background:#DDD6C8;border-color:#DDD6C8;color:#a29f90;cursor:not-allowed}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div class=\"app\">\n  <div class=\"top\">\n    <div class=\"logo\">Kai<\u002Fdiv>\n    <div class=\"addr\">208 Paradise Hills Cir, Mooresville, NC 28115<\u002Fdiv>\n    <div class=\"mono st\">ACTIVE<\u002Fdiv>\n    <div style=\"margin-left:auto;display:flex;align-items:center;gap:18px;padding-right:22px\">\n      <button style=\"position:relative;border:none;background:none;cursor:pointer;color:#cfcabf;padding:2px;line-height:0\">\n        <svg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9\"><\u002Fpath><path d=\"M13.7 21a2 2 0 0 1-3.4 0\"><\u002Fpath><\u002Fsvg>\n        <span style=\"position:absolute;top:0;right:1px;width:7px;height:7px;border-radius:50%;background:#C0443A;border:1.5px solid #1A1A1A\"><\u002Fspan>\n      <\u002Fbutton>\n      <div style=\"width:1px;height:22px;background:#3a3a3a\"><\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:8px;font-family:'Circular XX';font-weight:500;font-size:13px;color:#cfcabf\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FDFF86\"><\u002Fspan>Kaizen<\u002Fdiv>\n      <div class=\"av\">QH<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"body\">\n    <div class=\"rail\">\n      <div class=\"nav\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\"><\u002Frect><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\"><\u002Frect><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\"><\u002Frect><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\"><\u002Frect><\u002Fsvg>Dashboard<\u002Fdiv>\n      <div class=\"nav\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><circle cx=\"12\" cy=\"10\" r=\"3\"><\u002Fcircle><path d=\"M12 2C7.5 2 5 5 5 9c0 5 7 13 7 13s7-8 7-13c0-4-2.5-7-7-7Z\"><\u002Fpath><\u002Fsvg>Market<\u002Fdiv>\n      <div class=\"nav on\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><path d=\"M3 11 12 3l9 8\"><\u002Fpath><path d=\"M5 9.5V21h14V9.5\"><\u002Fpath><\u002Fsvg>Properties<\u002Fdiv>\n      <div class=\"nav\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><path d=\"M14 4l6 6-9 9-6 1 1-6z\"><\u002Fpath><\u002Fsvg>Contractors<\u002Fdiv>\n      <div class=\"nav\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><path d=\"M12 3l8 4v10l-8 4-8-4V7z\"><\u002Fpath><path d=\"M4 7l8 4 8-4M12 21V11\"><\u002Fpath><\u002Fsvg>Products<\u002Fdiv>\n      <div class=\"nav\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"16\"><\u002Frect><path d=\"M3 9h18M9 9v11\"><\u002Fpath><\u002Fsvg>Template<\u002Fdiv>\n      <div class=\"nav\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><circle cx=\"8\" cy=\"9\" r=\"3\"><\u002Fcircle><circle cx=\"16\" cy=\"9\" r=\"3\"><\u002Fcircle><path d=\"M3 20c0-3 2.5-5 5-5s5 2 5 5M13 20c0-3 2.5-5 5-5\"><\u002Fpath><\u002Fsvg>Users<\u002Fdiv>\n      <div class=\"nav\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><circle cx=\"7\" cy=\"8\" r=\"2\"><\u002Fcircle><path d=\"M11 8h9M4 8h1\"><\u002Fpath><circle cx=\"16\" cy=\"16\" r=\"2\"><\u002Fcircle><path d=\"M4 16h9M18 16h2\"><\u002Fpath><\u002Fsvg>Settings<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"main\">\n      <!-- top row: photo + property + market (equal height, photo drives it at 4:3) -->\n      <div style=\"display:flex;gap:10px;align-items:stretch;margin-bottom:20px\">\n        <!-- photo -->\n        <div style=\"width:592px;flex:none;position:relative\">\n          <div class=\"ph\" style=\"width:100%;aspect-ratio:4/3;border:1px solid #1A1A1A\">PROPERTY HERO PHOTO<\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- property details -->\n        <div class=\"card {{ frameCls }}\" style=\"flex:1;min-width:0;display:flex;flex-direction:column\">\n          <div class=\"card-h\">\n            <div class=\"ct\">Property Details<\u002Fdiv>\n            <sc-if value=\"{{ notEditing }}\" hint-placeholder-val=\"{{ true }}\"><button class=\"btn btn-bd\" onclick=\"{{ startEdit }}\">Edit<\u002Fbutton><\u002Fsc-if>\n            <sc-if value=\"{{ editing }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;gap:9px\"><button class=\"btn btn-cta\" onclick=\"{{ save }}\">Save<\u002Fbutton><button class=\"btn btn-bd\" onclick=\"{{ cancel }}\">Cancel<\u002Fbutton><\u002Fdiv><\u002Fsc-if>\n          <\u002Fdiv>\n          <sc-if value=\"{{ notEditing }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"padding:14px 22px 20px;flex:1;display:flex;flex-direction:column;justify-content:space-between\">\n              <div class=\"prow\"><span class=\"lbl\">Kai ID<\u002Fspan><span class=\"rv\">{{ d.kaiId }}<\u002Fspan><\u002Fdiv>\n              <div class=\"prow\"><span class=\"lbl\">Market<\u002Fspan><span class=\"rv\">{{ d.market }}<\u002Fspan><\u002Fdiv>\n              <div class=\"prow\"><span class=\"lbl\">Beds<\u002Fspan><span class=\"rv\">{{ d.beds }}<\u002Fspan><\u002Fdiv>\n              <div class=\"prow\"><span class=\"lbl\">Full Baths<\u002Fspan><span class=\"rv\">{{ d.fullBaths }}<\u002Fspan><\u002Fdiv>\n              <div class=\"prow\"><span class=\"lbl\">Half Baths<\u002Fspan><span class=\"rv\">{{ d.halfBaths }}<\u002Fspan><\u002Fdiv>\n              <div class=\"prow\"><span class=\"lbl\">Total Baths<\u002Fspan><span class=\"rv\">{{ d.totalBaths }}<\u002Fspan><\u002Fdiv>\n              <div class=\"prow\"><span class=\"lbl\">Square Feet<\u002Fspan><span class=\"rv\">{{ d.sqft }}<\u002Fspan><\u002Fdiv>\n              <div class=\"prow\"><span class=\"lbl\">Acres<\u002Fspan><span class=\"rv\">{{ d.acres }}<\u002Fspan><\u002Fdiv>\n              <div class=\"prow\"><span class=\"lbl\">Garage<\u002Fspan><span class=\"rv\">{{ d.garage }}<\u002Fspan><\u002Fdiv>\n              <div class=\"prow\"><span class=\"lbl\">Year Built<\u002Fspan><span class=\"rv\">{{ d.yearBuilt }}<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ editing }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding:12px 22px 20px;flex:1;display:flex;flex-direction:column;justify-content:space-between\">\n              <div class=\"prow\"><span class=\"lbl\">Kai ID<\u002Fspan><input class=\"inp\" style=\"width:170px;text-align:right\" data-k=\"kaiId\" value=\"{{ d.kaiId }}\" onchange=\"{{ onField }}\"><\u002Fdiv>\n              <div class=\"prow\"><span class=\"lbl\">Market<\u002Fspan><input class=\"inp\" style=\"width:170px;text-align:right\" data-k=\"market\" value=\"{{ d.market }}\" onchange=\"{{ onField }}\"><\u002Fdiv>\n              <div class=\"prow\"><span class=\"lbl\">Beds<\u002Fspan><input class=\"inp\" style=\"width:170px;text-align:right\" data-k=\"beds\" value=\"{{ d.beds }}\" onchange=\"{{ onField }}\"><\u002Fdiv>\n              <div class=\"prow\"><span class=\"lbl\">Full Baths<\u002Fspan><input class=\"inp\" style=\"width:170px;text-align:right\" data-k=\"fullBaths\" value=\"{{ d.fullBaths }}\" onchange=\"{{ onField }}\"><\u002Fdiv>\n              <div class=\"prow\"><span class=\"lbl\">Half Baths<\u002Fspan><input class=\"inp\" style=\"width:170px;text-align:right\" data-k=\"halfBaths\" value=\"{{ d.halfBaths }}\" onchange=\"{{ onField }}\"><\u002Fdiv>\n              <div class=\"prow\"><span class=\"lbl\">Total Baths<\u002Fspan><input class=\"inp\" style=\"width:170px;text-align:right\" data-k=\"totalBaths\" value=\"{{ d.totalBaths }}\" onchange=\"{{ onField }}\"><\u002Fdiv>\n              <div class=\"prow\"><span class=\"lbl\">Square Feet<\u002Fspan><input class=\"inp\" style=\"width:170px;text-align:right\" data-k=\"sqft\" value=\"{{ d.sqft }}\" onchange=\"{{ onField }}\"><\u002Fdiv>\n              <div class=\"prow\"><span class=\"lbl\">Acres<\u002Fspan><input class=\"inp\" style=\"width:170px;text-align:right\" data-k=\"acres\" value=\"{{ d.acres }}\" onchange=\"{{ onField }}\"><\u002Fdiv>\n              <div class=\"prow\"><span class=\"lbl\">Garage<\u002Fspan><input class=\"inp\" style=\"width:170px;text-align:right\" data-k=\"garage\" value=\"{{ d.garage }}\" onchange=\"{{ onField }}\"><\u002Fdiv>\n              <div class=\"prow\"><span class=\"lbl\">Year Built<\u002Fspan><input class=\"inp\" style=\"width:170px;text-align:right\" data-k=\"yearBuilt\" value=\"{{ d.yearBuilt }}\" onchange=\"{{ onField }}\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <!-- market details -->\n        <div class=\"card {{ frameCls }}\" style=\"flex:1;min-width:0;display:flex;flex-direction:column\">\n          <div class=\"card-h\"><div class=\"ct\">Market Details<\u002Fdiv><button class=\"btn btn-bd\">View Market<\u002Fbutton><\u002Fdiv>\n          <div style=\"padding:14px 22px 22px;flex:1;display:flex;flex-direction:column\">\n            <div style=\"margin-bottom:6px\">\n              <div class=\"prow\"><span class=\"lbl\">Name<\u002Fspan><span class=\"rv\">{{ market.name }}<\u002Fspan><\u002Fdiv>\n              <div class=\"prow\"><span class=\"lbl\">Zip Codes<\u002Fspan><span class=\"rv\">{{ zipStr }}<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"border-top:1px solid #ece5d6;padding-top:16px;margin-top:10px\">\n              <div style=\"display:flex;justify-content:space-between;gap:16px;align-items:baseline;margin-bottom:14px\">\n                <span class=\"lbl\" style=\"flex:none\">Project Managers<\u002Fspan>\n                <div style=\"text-align:right;display:flex;flex-direction:column;gap:7px\">\n                  <div style=\"font-family:'Circular XX';font-weight:600;font-size:14px\">Jordan Diaz<\u002Fdiv>\n                  <div style=\"font-family:'Circular XX';font-weight:600;font-size:14px\">Priya Shah<\u002Fdiv>\n                  <div style=\"font-family:'Circular XX';font-weight:500;font-size:13px;color:#7D7469\">+ 1 more<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;gap:16px;align-items:baseline\">\n                <span class=\"lbl\" style=\"flex:none\">Field Agents<\u002Fspan>\n                <div style=\"text-align:right;display:flex;flex-direction:column;gap:7px\">\n                  <div style=\"font-family:'Circular XX';font-weight:600;font-size:14px\">Sam Price<\u002Fdiv>\n                  <div style=\"font-family:'Circular XX';font-weight:600;font-size:14px\">Avery Rowe<\u002Fdiv>\n                  <div style=\"font-family:'Circular XX';font-weight:500;font-size:13px;color:#7D7469\">+ 5 more<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"border-top:1px solid #ece5d6;padding-top:16px;margin-top:16px\">\n              <div style=\"display:flex;justify-content:space-between;gap:16px;align-items:baseline\">\n                <span class=\"lbl\" style=\"flex: ><\u002Fsvg>\n                  <span class=\"disp\" style=\"font-weight:600;font-size:14px\">{{ p.name }}<\u002Fspan>\n                <\u002Fdiv>\n                <span style=\"font-family:'Circular XX';font-weight:500;font-size:13px;color:#57544b;flex:none\">{{ p.type }}<\u002Fspan>\n                <span style=\"font-family:'Circular XX';font-weight:500;color:#9a927f;font-size:12.5px;margin-left:auto\">Not assigned — ask your admin to be added to view details.<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ p.unlocked }}\" hint-placeholder-val=\"{{ true }}\">\n            <div class=\"trow\">\n              <div class=\"td\"><div class=\"disp\" style=\"font-weight:600;font-size:14.5px;line-height:1.25\">{{ p.name }}<\u002Fdiv><\u002Fdiv>\n              <div class=\"td\" style=\"color:#1A1A1A\">{{ p.type }}<\u002Fdiv>\n              <div class=\"td\"><span class=\"pill {{ p.stCls }}\"><span class=\"dot\" style=\"background:currentColor\"><\u002Fspan>{{ p.status }}<\u002Fspan><\u002Fdiv>\n              <div class=\"td\"><div style=\"white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ p.assignees }}<\u002Fdiv><\u002Fdiv>\n              <div class=\"td\" style=\"justify-content:flex-end\"><span style=\"font-family:'Circular XX';font-weight:600;font-size:13.5px;color:#1A1A1A\">{{ p.budget }}<\u002Fspan><\u002Fdiv>\n              <div class=\"td\" style=\"font-family:'Maxeville Construct';font-weight:400;font-size:11px;letter-spacing:.04em;color:#7D7469;white-space:nowrap\">{{ p.updated }}<\u002Fdiv>\n              <div class=\"td\"><button class=\"hl\" style=\"font-size:11.5px\" onclick=\"{{ p.onNotes }}\"><span>View<\u002Fspan><\u002Fbutton><\u002Fdiv>\n              <div class=\"td\" style=\"justify-content:flex-end;padding-left:0;padding-right:10px\">\n                <div style=\"position:relative\" data-menu=\"\">\n                  <button onclick=\"{{ p.onMenu }}\" style=\"border:none;background:none;cursor:pointer;font-size:19px;color:#7D7469;line-height:1;padding:2px 5px\">⋮<\u002Fbutton>\n                  <sc-if value=\"{{ p.menuOpen }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"menu {{ p.menuUpCls }}\"><sc-if value=\"{{ p.isComplete }}\" hint-placeholder-val=\"{{ false }}\"><button class=\"mi\">Reactivate<\u002Fbutton><\u002Fsc-if><sc-if value=\"{{ p.notComplete }}\" hint-placeholder-val=\"{{ true }}\"><button class=\"mi\">Complete Project<\u002Fbutton><\u002Fsc-if><button class=\"mi mi-red\">Archive<\u002Fbutton><\u002Fdiv><\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fsc-for>\n        <sc-if value=\"{{ empty }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"border-top:1px solid #ece5d6;display:flex;align-items:center;justify-content:center;padding:40px;font-family:'Circular XX';font-weight:500;font-size:14px;color:#7D7469\">No projects match your filters.<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<sc-if value=\"{{ modalOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div class=\"modal-scrim\" onclick=\"{{ closeModal }}\"><\u002Fdiv>\n  <div class=\"modal-scrim\" style=\"background:none;pointer-events:none\">\n    <div class=\"modal\" style=\"pointer-events:auto\">\n      <div style=\"padding:22px 26px 15px;border-bottom:1px solid #ece5d6\">\n        <div style=\"display:flex;align-items:flex-start;justify-content:space-between\">\n          <div class=\"disp\" style=\"font-weight:700;font-size:23px;letter-spacing:-.01em\">Create New Project<\u002Fdiv>\n          <button onclick=\"{{ closeModal }}\" style=\"border:none;background:none;cursor:pointer;color:#1A1A1A;padding:2px;line-height:0\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\"><path d=\"M6 6l12 12M18 6L6 18\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"margin-top:7px;font-family:'Circular XX';font-weight:500;font-size:13px;color:#7D7469\">Create a project by entering the information below.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:18px 26px;display:flex;flex-direction:column;gap:11px\">\n        <div class=\"g2\">\n          <div class=\"fset\">\n            <span class=\"lbl leg\">Project Type<\u002Fspan>\n            <div style=\"position:relative\" data-dd=\"\">\n              <button onclick=\"{{ toggleType }}\" style=\"width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;border:none;background:none;cursor:pointer;padding:1px 0;font-family:'Circular XX';font-weight:400;font-size:15px;color:{{ typeColor }}\">\n                <span>{{ typeDisplay }}<\u002Fspan>\n                <svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7D7469\" stroke-width=\"1.8\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg>\n              <\u002Fbutton>\n              <sc-if value=\"{{ ddTypeOpen }}\" hint-placeholder-val=\"{{ false }}\">\n                <div class=\"menu\" style=\"left:-13px;right:-13px;width:auto;top:34px;padding:5px\">\n                  <sc-for list=\"{{ typeOpts }}\" as=\"o\" hint-placeholder-count=\"5\">\n                    <button class=\"optrow {{ o.cls }}\" onclick=\"{{ o.onClick }}\"><span style=\"flex:1\">{{ o.label }}<\u002Fspan><span>{{ o.check }}<\u002Fspan><\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"fset\">\n            <span class=\"lbl leg\">Project Budget <span class=\"opt\">(Optional)<\u002Fspan><\u002Fspan>\n            <div style=\"display:flex;align-items:center;gap:6px\">\n              <span style=\"font-family:'Circular XX';font-weight:600;font-size:15px;color:#7D7469\">$<\u002Fspan>\n              <input class=\"fld\" placeholder=\"0.00\">\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"fset\">\n          <span class=\"lbl leg\">Project Name <span class=\"opt\">(Optional)<\u002Fspan><\u002Fspan>\n          <input class=\"fld\" placeholder=\"Name this project\">\n        <\u002Fdiv>\n        <div class=\"g2\">\n          <div class=\"fset\">\n            <span class=\"lbl leg\">Scope Due Date<\u002Fspan>\n            <div style=\"display:flex;align-items:center;justify-content:space-between;gap:8px\">\n              <input class=\"fld\" value=\"Jul 6, 2026\">\n              <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7D7469\" stroke-width=\"1.6\"><rect x=\"3.5\" y=\"5\" width=\"17\" height=\"16\" rx=\"1.5\"><\u002Frect><path d=\"M3.5 9.5h17M8 3v4M16 3v4\"><\u002Fpath><\u002Fsvg>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"fset\">\n            <span class=\"lbl leg\">Project End Date<\u002Fspan>\n            <div style=\"display:flex;align-items:center;justify-content:space-between;gap:8px\">\n              <input class=\"fld\" value=\"Jul 6, 2026\">\n              <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7D7469\" stroke-width=\"1.6\"><rect x=\"3.5\" y=\"5\" width=\"17\" height=\"16\" rx=\"1.5\"><\u002Frect><path d=\"M3.5 9.5h17M8 3v4M16 3v4\"><\u002Fpath><\u002Fsvg>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"g2\">\n          <div class=\"fset\">\n            <span class=\"lbl leg\">Door Code <span class=\"opt\">(Optional)<\u002Fspan><\u002Fspan>\n            <input class=\"fld\" placeholder=\"—\">\n          <\u002Fdiv>\n          <div class=\"fset\">\n            <span class=\"lbl leg\">Gate Code <span class=\"opt\">(Optional)<\u002Fspan><\u002Fspan>\n            <input class=\"fld\" placeholder=\"—\">\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div class=\"fset\">\n            <span class=\"lbl leg\">Project Dispatch Notes <span class=\"opt\">(Optional)<\u002Fspan><\u002Fspan>\n            <textarea class=\"fld\" rows=\"3\" maxlength=\"300\" value=\"{{ form.notes }}\" oninput=\"{{ onNotes }}\" placeholder=\"Access details, on-site instructions, or context for the crew…\" style=\"resize:none;line-height:1.5\"><\u002Ftextarea>\n          <\u002Fdiv>\n          <div style=\"text-align:right;margin-top:5px;font-family:'Maxeville Construct';font-weight:400;font-size:10px;letter-spacing:.06em;color:#a8a08d\">{{ notesCount }} / 300<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"g2\">\n          <div class=\"fset\">\n            <span class=\"lbl leg\">Project Template<\u002Fspan>\n            <div style=\"position:relative\" data-dd=\"\">\n              <button onclick=\"{{ toggleTemplate }}\" style=\"width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;border:none;background:none;cursor:pointer;padding:1px 0;font-family:'Circular XX';font-weight:400;font-size:15px;color:#1A1A1A\">\n                <span>{{ templateDisplay }}<\u002Fspan>\n                <svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7D7469\" stroke-width=\"1.8\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg>\n              <\u002Fbutton>\n              <sc-if value=\"{{ ddTemplateOpen }}\" hint-placeholder-val=\"{{ false }}\">\n                <div class=\"menu\" style=\"left:-13px;right:-13px;width:auto;top:34px;padding:5px\">\n                  <sc-for list=\"{{ templateOpts }}\" as=\"o\" hint-placeholder-count=\"3\">\n                    <button class=\"optrow {{ o.cls }}\" onclick=\"{{ o.onClick }}\"><span style=\"flex:1\">{{ o.label }}<\u002Fspan><span>{{ o.check }}<\u002Fspan><\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"fset\">\n            <span class=\"lbl leg\">Field User Border style&quot;}}\">\nclass Component extends DCLogic {\n  PROJECTS = [\n    { id: 'p1', type: 'Training', name: 'Acquisition walkthrough & disposition scope review', status: 'In Progress',\n      desc: 'Notes here \\u2014 walkthrough scheduled with the acquisitions team to confirm scope before disposition. Punch list still open on exterior items, and interior paint touch-ups are pending final sign-off from the field agent.',\n      assignees: 'Jordan Diaz, Marcus Okafor', budget: '$30,000.00', created: '3/19/2026', updated: '3/19/2026' },\n    { id: 'p2', type: 'Renovation', name: 'Kitchen refresh', status: 'Pending Review',\n      desc: 'Replace cabinets and quartz countertops, new sink and disposal, repaint walls and trim. Contractor quote submitted; awaiting change-order approval from the market manager before work begins.',\n      assignees: 'Sam Price, Avery Rowe', budget: '$18,500.00', created: '2/28/2026', updated: '3/12/2026' },\n    { id: 'p3', type: 'Acquisition', name: 'Roof survey', status: 'Complete',\n      desc: 'Pre-purchase roof and attic inspection. No active leaks found; two cracked shingles flagged for repair. Report filed and closed out with photos attached.',\n      assignees: 'Tom\\u00e1s N\\u00fa\\u00f1ez', budget: '$4,200.00', created: '1/06/2026', updated: '2/02/2026' },\n    { id: 'p4', type: 'Turn', name: 'Full unit turn — flooring, paint & fixtures', status: 'Not Started',\n      desc: 'Complete make-ready turn ahead of listing: flooring, paint, fixtures, and deep clean. Scope drafted; awaiting contractor assignment and schedule confirmation.',\n      assignees: 'Avery Rowe', budget: '$42,000.00', created: '3/22/2026', updated: '3/25/2026' },\n    { id: 'p5', type: 'Turn', name: 'HVAC service', status: 'In Review', \n      desc: 'Seasonal HVAC service and filter replacement across both units. Technician report submitted and under review by the field agent before close-out.',\n      assignees: 'Marcus Okafor', budget: '$1,850.00', created: '2/10/2026', updated: '3/01/2026' },\n    { id: 'p6', type: 'Renovation', name: 'Exterior repaint with siding & fascia repair', status: 'In Progress',\n      desc: 'Repaint siding, trim, and shutters; repair fascia on the north elevation. Color selection needs sign-off from the market manager before purchasing.',\n      assignees: 'Sam Price, Jordan Diaz', budget: '$9,600.00', created: '1/28/2026', updated: '2/18/2026' },\n  ];\n  SORTS = [\n    { value: 'newest', label: 'Newest\\u2013Oldest' },\n    { value: 'attention', label: 'Needs Attention' },\n    { value: 'name', label: 'Project Name A\\u2013Z' },\n    { value: 'type', label: 'Project Type A\\u2013Z' },\n  ];\n  STATUSES = [\n    { label: 'Not Started', dot: '#7D7469' },\n    { label: 'In Progress', dot: '#3E6B8B' },\n    { label: 'Pending Review', dot: '#C0443A' },\n    { label: 'In Review', dot: '#C0443A' },\n    { label: 'Complete', dot: '#4A8C5C' },\n  ];\n  ATTENTION = ['Pending Review', 'In Review'];\n  state = {\n    open: null, exp: {}, editing: false,\n    data: { kaiId: 'TX1234', market: 'Charlotte', beds: '4', fullBaths: '3', halfBaths: '0', totalBaths: '3', sqft: '3,335', acres: '0.214', garage: 'No', yearBuilt: '2006' },\n    view: 'table',\n    sort: 'newest', statusFilter: [], filterOpen: false, sortOpen: false, colFilterOpen: false, searchOpen: false, query: '',\n    drawerOpen: false,\n    modalOpen: false,\n    form: { type: '', notes: '', template: 'Kai Base Template 1:2:26', fieldUser: '' },\n    openDD: null,\n    notesOpen: null, notesDraft: '', projectNotes: {},\n    market: {\n      name: 'Charlotte',\n      zips: ['28115', '28117'],\n      contractors: ['Penelope the Painter', 'Paul the Plumber', 'Bob the Builder', 'Eric the Electrician', 'Lary Landscaper'],\n      managers: ['Jordan Diaz', 'Priya Shah', 'Marcus Webb'],\n      agents: ['Sam Price', 'Avery Rowe', 'Marcus Okafor'],\n    },\n  };\n  addToMarket(key, e) {\n    if (e.key !== 'Enter') return;\n    e.preventDefault();\n    const v = e.target.value.trim();\n    if (v) this.setState((s) => (s.market[key].includes(v) ? {} : { market: { ...s.market, [key]: [...s.market[key], v] } }));\n    e.target.value = '';\n  }\n  mkOpts(field, list, current) {\n    return list.map((v) => ({\n      label: v,\n      check: current === v ? '\\u2713' : '',\n      cls: current === v ? 'on' : '',\n      onClick: (e) => { e.stopPropagation(); this.setState((s) => ({ form: { ...s.form, [field]: v }, openDD: null })); },\n    }));\n  }\n  componentDidMount() {\n    this._away = (e) => {\n      const st = {};\n      if (!e.target.closest('[data-menu]')) st.open = null;\n      if (!e.target.closest('[data-filter]')) st.filterOpen = false;\n      if (!e.target.closest('[data-sort]')) st.sortOpen = false;\n      if (!e.target.closest('[data-colfilter]')) st.colFilterOpen = false;\n      if (!e.target.closest('[data-dd]')) st.openDD = null;\n      if (Object.keys(st).length) this.setState(st);\n    };\n    document.addEventListener('click', this._away);\n    this._key = (e) => { if (e.key === 'Escape') this.setState({ modalOpen: false, drawerOpen: false, notesOpen: null }); };\n    document.addEventListener('keydown', this._key);\n  }\n  componentWillUnmount() { document.removeEventListener('click', this._away); document.removeEventListener('keydown', this._key); }\n  ts(d) { const [m, day, y] = d.split('/').map(Number); return new Date(y, m - 1, day).getTime(); }\n  dotFor(status) { const s = this.STATUSES.find((x) => x.label === status); return s ? s.dot : '#7D7469'; }\n  stClsFor(status) {\n    const map = { 'Complete': 'st-green', 'In Progress': 'st-blue', 'In Review': 'st-red', 'Pending Review': 'st-red', 'Not Started': 'st-gray' };\n    return map[status] || 'st-gray';\n  }\n  renderVals() {\n    const { sort, statusFilter, query, exp, open } = this.state;\n    const q = query.trim().toLowerCase();\n    const attn = new Set(this.ATTENTION);\n    let list = this.PROJECTS.filter((p) => {\n      if (statusFilter.length && !statusFilter.includes(p.status)) return false;\n      if (q) { const hay = (p.name + ' ' + p.type + ' ' + p.desc + ' ' + p.assignees + ' ' + p.status).toLowerCase(); if (!hay.includes(q)) return false; }\n      return true;\n    });\n    const STORDER = ['Not Started', 'In Progress', 'Pending Review', 'In Review', 'Complete'];\n    const bnum = (s) => Number(String(s).replace(/[^0-9.]/g, '')) || 0;\n    const sorters = {\n      newest: (a, b) => this.ts(b.updated) - this.ts(a.updated),\n      oldest: (a, b) => this.ts(a.updated) - this.ts(b.updated),\n      attention: (a, b) => (attn.has(b.status) ? 1 : 0) - (attn.has(a.status) ? 1 : 0) || this.ts(b.updated) - this.ts(a.updated),\n      name: (a, b) => a.name.localeCompare(b.name),\n      name_desc: (a, b) => b.name.localeCompare(a.name),\n      type: (a, b) => a.type.localeCompare(b.type),\n      type_desc: (a, b) => b.type.localeCompare(a.type),\n      status: (a, b) => STORDER.indexOf(a.status) - STORDER.indexOf(b.status),\n      status_desc: (a, b) => STORDER.indexOf(b.status) - STORDER.indexOf(a.status),\n      budget: (a, b) => bnum(b.budget) - bnum(a.budget),\n      budget_low: (a, b) => bnum(a.budget) - bnum(b.budget),\n    };\n    list = list.slice().sort(sorters[sort] || sorters.newest);\n    const projects = list.map((p, i) => ({\n      ...p,\n      stCls: this.stClsFor(p.status),\n      isComplete: p.status === 'Complete',\n      notComplete: p.status !== 'Complete',\n      locked: !!p.locked,\n      unlocked: !p.locked,\n      menuOpen: open === p.id,\n      menuUpCls: (i >= list.length - 2) ? 'up' : '',\n      onMenu: (e) => { e.stopPropagation(); this.setState((s) => ({ open: s.open === p.id ? null : p.id })); },\n      onNotes: () => this.setState((s) => ({ notesOpen: p.id, notesDraft: (s.projectNotes[p.id] ?? p.desc) })),\n    }));\n    const sortOptions = this.SORTS.map((o) => ({\n      label: o.label, cls: sort === o.value ? 'on' : '', check: sort === o.value ? '\\u2713' : '',\n      onClick: (e) => { e.stopPropagation(); this.setState({ sort: o.value, sortOpen: false }); },\n    }));\n    const statusOptions = this.STATUSES.map((o) => ({\n      label: o.label, dot: o.dot, cls: statusFilter.includes(o.label) ? 'on' : '', check: statusFilter.includes(o.label) ? '\\u2713' : '',\n      onClick: (e) => { e.stopPropagation(); this.setState((s) => { const f = s.statusFilter.includes(o.label) ? s.statusFilter.filter((x) => x !== o.label) : [...s.statusFilter, o.label]; return { statusFilter: f }; }); },\n    }));\n    const cur = this.SORTS.find((o) => o.value === sort);\n    const toggle = (asc, desc) => (e) => { e.stopPropagation(); this.setState({ sort: sort === asc ? desc : asc, sortOpen: false, filterOpen: false, colFilterOpen: false }); };\n    const arr = (asc, desc) => (sort === asc ? '\\u2191' : '\\u2193');\n    const acol = (asc, desc) => ((sort === asc || sort === desc) ? '#1A1A1A' : '#9a927f');\n    return {\n      sortName: toggle('name', 'name_desc'), arrowName: arr('name', 'name_desc'), colName: acol('name', 'name_desc'),\n      sortType: toggle('type', 'type_desc'), arrowType: arr('type', 'type_desc'), colType: acol('type', 'type_desc'),\n      sortStatus: toggle('status', 'status_desc'), arrowStatus: arr('status', 'status_desc'), colStatus: acol('status', 'status_desc'),\n      sortBudget: toggle('budget_low', 'budget'), arrowBudget: arr('budget_low', 'budget'), colBudget: acol('budget_low', 'budget'),\n      sortUpdated: (e) => { e.stopPropagation(); this.setState((s) => ({ sort: s.sort === 'oldest' ? 'newest' : 'oldest', sortOpen: false, filterOpen: false, colFilterOpen: false })); },\n      arrowUpdated: sort === 'oldest' ? '\\u2191' : '\\u2193',\n      colUpdated: (sort === 'newest' || sort === 'oldest') ? '#1A1A1A' : '#9a927f',\n      colFilterOpen: this.state.colFilterOpen,\n      toggleColFilter: (e) => { e.stopPropagation(); this.setState((s) => ({ colFilterOpen: !s.colFilterOpen, filterOpen: false, sortOpen: false })); },\n      projects, empty: projects.length === 0,\n      view: this.state.view,\n      viewCards: this.state.view === 'cards',\n      viewTable: this.state.view === 'table',\n      cardsCls: this.state.view === 'cards' ? 'on' : '',\n      tableCls: this.state.view === 'table' ? 'on' : '',\n      setCards: () => this.setState({ view: 'cards' }),\n      setTable: () => this.setState({ view: 'table' }),\n      cardsBg: this.state.view === 'cards' ? '#FDFF86' : '#fff',\n      tableBg: this.state.view === 'table' ? '#FDFF86' : '#fff',\n      sortOptions, statusOptions,\n      sortLabel: ({\n        newest: 'Newest\\u2013Oldest', oldest: 'Oldest\\u2013Newest',\n        attention: 'Needs Attention',\n        name: 'Project Name A\\u2013Z', name_desc: 'Project Name Z\\u2013A',\n        type: 'Type A\\u2013Z', type_desc: 'Type Z\\u2013A',\n        status: 'Status', status_desc: 'Status (reverse)',\n        budget_low: 'Budget Low\\u2013High', budget: 'Budget High\\u2013Low',\n      })[sort] || (cur ? cur.label : 'Newest\\u2013Oldest'),\n      sortButtonLabel: 'Sort \\u00b7 ' + (cur ? cur.label : 'Newest\\u2013Oldest'),\n      filterButtonLabel: statusFilter.length === 0 ? 'Filter \\u00b7 All' : (statusFilter.length === 1 ? 'Filter \\u00b7 ' + statusFilter[0] : 'Filter \\u00b7 ' + statusFilter.length + ' statuses'),\n      filterValue: statusFilter.length === 0 ? 'All' : (statusFilter.length === 1 ? statusFilter[0] : statusFilter.length + ' statuses'),\n      hasFilters: statusFilter.length > 0,\n      filterCount: statusFilter.length,\n      clearFilters: (e) => { e.stopPropagation(); this.setState({ statusFilter: [] }); },\n      sortOpen: this.state.sortOpen,\n      toggleSort: (e) => { e.stopPropagation(); this.setState((s) => ({ sortOpen: !s.sortOpen, filterOpen: false })); },\n      filterOpen: this.state.filterOpen,\n      toggleFilter: (e) => { e.stopPropagation(); this.setState((s) => ({ filterOpen: !s.filterOpen, sortOpen: false })); },\n      searchOpen: this.state.searchOpen,\n      toggleSearch: (e) => { e.stopPropagation(); this.setState((s) => ({ searchOpen: !s.searchOpen })); },\n      searchBg: this.state.searchOpen ? '#FDFF86' : '#fff',\n      query,\n      onSearch: (e) => this.setState({ query: e.target.value }),\n      d: this.state.data,\n      editing: this.state.editing,\n      notEditing: !this.state.editing,\n      startEdit: () => this.setState({ editing: true }),\n      save: () => this.setState({ editing: false }),\n      cancel: () => this.setState({ editing: false }),\n      onField: (e) => { const k = e.target.dataset.k, v = e.target.value; this.setState((s) => ({ data: { ...s.data, [k]: v } })); },\n      frameCls: (this.props.frame === 'ink') ? 'card-ink' : '',\n      market: this.state.market,\n      zipStr: this.state.market.zips.join(', '),\n      contractorCount: this.state.market.contractors.length,\n      drawerOpen: this.state.drawerOpen,\n      openDrawer: () => this.setState({ drawerOpen: true }),\n      closeDrawer: () => this.setState({ drawerOpen: false }),\n      addZip: (e) => this.addToMarket('zips', e),\n      addContractor: (e) => this.addToMarket('contractors', e),\n      addManager: (e) => this.addToMarket('managers', e),\n      addAgent: (e) => this.addToMarket('agents', e),\n      modalOpen: this.state.modalOpen,\n      openModal: () => this.setState({ modalOpen: true }),\n      closeModal: () => this.setState({ modalOpen: false }),\n      form: this.state.form,\n      openDD: this.state.openDD,\n      ddTypeOpen: this.state.openDD === 'type',\n      ddTemplateOpen: this.state.openDD === 'template',\n      ddFieldOpen: this.state.openDD === 'field',\n      toggleType: (e) => { e.stopPropagation(); this.setState((s) => ({ openDD: s.openDD === 'type' ? null : 'type' })); },\n      toggleTemplate: (e) => { e.stopPropagation(); this.setState((s) => ({ openDD: s.openDD === 'template' ? null : 'template' })); },\n      toggleField: (e) => { e.stopPropagation(); this.setState((s) => ({ openDD: s.openDD === 'field' ? null : 'field' })); },\n      typeDisplay: this.state.form.type || 'Select type\\u2026',\n      typeIsSet: !!this.state.form.type,\n      typeColor: this.state.form.type ? '#1A1A1A' : '#a8a08d',\n      fieldColor: this.state.form.fieldUser ? '#1A1A1A' : '#a8a08d',\n      templateDisplay: this.state.form.template || 'Select template\\u2026',\n      fieldDisplay: this.state.form.fieldUser || 'Select field user\\u2026',\n      fieldIsSet: !!this.state.form.fieldUser,\n      typeOpts: this.mkOpts('type', ['Turn', 'Acquisition', 'Renovation', 'Disposition', 'Training'], this.state.form.type),\n      templateOpts: this.mkOpts('template', ['Kai Base Template 1:2:26', 'Renovation Standard', 'Inspection Checklist'], this.state.form.template),\n      fieldOpts: this.mkOpts('fieldUser', ['Sam Price', 'Avery Rowe', 'Marcus Okafor', 'Tomás Núñez'], this.state.form.fieldUser),\n      onType: (e) => { const v = e.target.value; this.setState((s) => ({ form: { ...s.form, type: v } })); },\n      onNotes: (e) => { const v = e.target.value.slice(0, 300); this.setState((s) => ({ form: { ...s.form, notes: v } })); },\n      notesCount: this.state.form.notes.length,\n      ctaDisabled: !(this.state.form.type && this.state.form.fieldUser),\n      ctaCls: (this.state.form.type && this.state.form.fieldUser) ? '' : 'cta-off',\n      notesOpen: this.state.notesOpen,\n      notesProjectName: (this.PROJECTS.find((p) => p.id === this.state.notesOpen) || {}).name || '',\n      notesDraft: this.state.notesDraft,\n      onNotesEdit: (e) => { const v = e.target.value; this.setState({ notesDraft: v }); },\n      closeNotes: () => this.setState({ notesOpen: null }),\n      saveNotes: () => this.setState((s) => ({ projectNotes: { ...s.projectNotes, [s.notesOpen]: s.notesDraft }, notesOpen: null })),\n    };\n  }\n}\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
